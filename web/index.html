<title>CRM Менти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Раскладка: боковое меню + рабочая область; доска — горизонтальные колонки этапов. */
:root {
  --bg: #f4f5f1;
  --surface: #ffffff;
  --surface-2: #eef0ea;
  --border: #dfe2d9;
  --text: #1b1f1b;
  --muted: #697064;
  --brand: #2f5d50;
  --brand-ink: #ffffff;
  --brand-soft: #e1ece7;
  --danger: #b2412e;
  --danger-soft: #f8e4df;
  --warn: #946500;
  --warn-soft: #faefd2;
  --ok: #2c7a4c;
  --ok-soft: #dff0e5;
  --g-sales: #3a6bb2;  --g-sales-soft: #e3ebf6;
  --g-study: #85549f;  --g-study-soft: #eee5f5;
  --g-job: #2c7a4c;    --g-job-soft: #dff0e5;
  --g-closed: #848a80; --g-closed-soft: #e9ebe5;
  --shadow: 0 1px 2px rgba(25, 35, 25, .06);
  --overlay: rgba(20, 26, 22, .42);
  --font: "Onest", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141714; --surface: #1c201c; --surface-2: #252a25; --border: #333a33;
    --text: #e6e9e3; --muted: #9aa195; --brand: #72b49f; --brand-ink: #0f231c; --brand-soft: #21352e;
    --danger: #eb8a77; --danger-soft: #3a2420; --warn: #e0b452; --warn-soft: #383020;
    --ok: #77c795; --ok-soft: #1e3427;
    --g-sales: #85aae3; --g-sales-soft: #1f2a3a; --g-study: #c19ce3; --g-study-soft: #2c2437;
    --g-job: #77c795; --g-job-soft: #1e3427; --g-closed: #9aa195; --g-closed-soft: #282c28;
    --shadow: none; --overlay: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141714; --surface: #1c201c; --surface-2: #252a25; --border: #333a33;
  --text: #e6e9e3; --muted: #9aa195; --brand: #72b49f; --brand-ink: #0f231c; --brand-soft: #21352e;
  --danger: #eb8a77; --danger-soft: #3a2420; --warn: #e0b452; --warn-soft: #383020;
  --ok: #77c795; --ok-soft: #1e3427;
  --g-sales: #85aae3; --g-sales-soft: #1f2a3a; --g-study: #c19ce3; --g-study-soft: #2c2437;
  --g-job: #77c795; --g-job-soft: #1e3427; --g-closed: #9aa195; --g-closed-soft: #282c28;
  --shadow: none; --overlay: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
a { color: var(--brand); }
h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
h3 { font-size: 13px; margin: 16px 0 6px; font-weight: 600; }
h1 small, h2 small, h3 small { color: var(--muted); font-weight: 400; font-size: 13px; }
p { margin: 0; }
.muted { color: var(--muted); }
.right { margin-left: auto; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 14px 0; text-align: center; }
.hint { color: var(--muted); font-size: 12.5px; }
.danger-text { color: var(--danger); }
.warn-text { color: var(--warn); }
:focus-visible, .tabs button:focus-visible, .link:focus-visible, .back:focus-visible, .x:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Каркас */
.layout { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--surface) 211px, var(--border) 211px, var(--border) 212px, var(--bg) 212px); }
.side {
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; align-self: start;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; padding: 0 8px; font-size: 15px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 8px; color: var(--text); }
.nav button:hover { background: var(--surface-2); }
.nav button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav button:focus-visible { outline: 2px solid var(--brand); }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.busy { background: var(--warn); }
.main { padding: 22px 28px 48px; min-width: 0; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head > div { min-width: 0; }
.page-head p { margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { all: unset; cursor: pointer; font-size: 13px; color: var(--muted); display: inline-block; margin-bottom: 4px; }
.back:hover { color: var(--text); }

/* Элементы */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); padding: 7px 12px; border-radius: 8px;
  font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.badge, .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b-sales { background: var(--g-sales-soft); color: var(--g-sales); }
.b-study { background: var(--g-study-soft); color: var(--g-study); }
.b-job { background: var(--g-job-soft); color: var(--g-job); }
.b-closed { background: var(--g-closed-soft); color: var(--g-closed); }
.tag.ok, .tag.a-accepted, .tag.a-offer { background: var(--ok-soft); color: var(--ok); }
.tag.danger, .tag.a-rejected { background: var(--danger-soft); color: var(--danger); }
.tag.warn, .tag.a-interview, .tag.a-test { background: var(--warn-soft); color: var(--warn); }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; margin-left: auto; flex: none; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); margin-bottom: 16px; }
.banner p { flex: 1 1 260px; }

input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
input[type=checkbox] { width: auto; accent-color: var(--brand); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters input[type=search] { flex: 1 1 220px; max-width: 280px; }
.filters select { width: auto; max-width: 100%; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--text); border-color: var(--brand); font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { border-top: 1px solid var(--border); border-bottom: 0; font-weight: 600; }
.compact th, .compact td { padding: 6px 8px; }
.compact th:first-child, .compact td:first-child { padding-left: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-danger td { background: var(--danger-soft); }
.row-actions { text-align: right; white-space: nowrap; }
.link { all: unset; cursor: pointer; color: var(--brand); font-weight: 500; }
.link:hover { text-decoration: underline; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.list li:last-child { border-bottom: 0; }

/* Сводка */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.kpi.accent { border-color: var(--brand); background: var(--brand-soft); }
.kpi-label { color: var(--muted); font-size: 12.5px; }
.kpi-value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-sub { color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; margin-bottom: 16px; }
.funnel { display: flex; flex-direction: column; gap: 6px; }
.funnel-row { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 74px; gap: 10px; align-items: center; }
.funnel-label { font-size: 13px; }
.funnel-bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.funnel-bar > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; min-width: 2px; }
.funnel-num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.funnel-num small { color: var(--muted); font-weight: 400; }

/* Доска */
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col { flex: 0 0 232px; background: var(--surface-2); border-radius: var(--radius); display: flex; flex-direction: column; border-top: 3px solid var(--g-sales); max-height: calc(100vh - 200px); }
.col.g-study { border-top-color: var(--g-study); }
.col.g-job { border-top-color: var(--g-job); }
.col.g-closed { border-top-color: var(--g-closed); }
.col > header { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; font-weight: 600; font-size: 13px; }
.count { color: var(--muted); font-weight: 500; }
.col-body { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 64px; }
.col.drop { outline: 2px dashed var(--brand); outline-offset: -2px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; cursor: grab; box-shadow: var(--shadow); }
.tile:hover { border-color: var(--brand); }
.tile.alert { box-shadow: inset 3px 0 0 var(--danger); }
.tile.dragging { opacity: .45; }
.tile strong { font-weight: 600; font-size: 13.5px; }
.tile-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.tile-foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-top: 2px; flex-wrap: wrap; }

/* Карточка студента */
.stepper { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.step { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 99px; cursor: pointer; }
.step:hover { color: var(--text); border-color: var(--brand); }
.step.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.step.lost.on { background: var(--g-closed); border-color: var(--g-closed); }
.detail { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.facts h2 { margin: 16px 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.facts h2:first-child { margin-top: 0; }
.facts dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head h2 { margin: 0; }
.note-form { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { padding: 10px 0; border-top: 1px solid var(--border); }
.feed-head { display: flex; gap: 8px; font-size: 12.5px; margin-bottom: 2px; flex-wrap: wrap; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }

/* Окна */
#modal[hidden] { display: none; }
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: start center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; z-index: 20; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 520px; box-shadow: 0 18px 48px rgba(0, 0, 0, .25); }
.modal.wide { max-width: 760px; }
.modal header { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; }
.modal header h2 { margin: 0; flex: 1; font-size: 17px; }
.x { all: unset; cursor: pointer; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--text); background: var(--surface-2); }
.mbody { padding: 14px 20px 4px; }
.mbody fieldset { border: 0; padding: 0; margin: 0 0 14px; }
.mbody legend { font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; min-width: 0; }
.field > span { color: var(--muted); }
.field.span2 { grid-column: 1 / -1; }
.field.checkbox { flex-direction: row; align-items: center; gap: 8px; align-self: end; padding-bottom: 8px; }
.field.checkbox > span { color: var(--text); }
.field small { color: var(--muted); }
.merr { color: var(--danger); padding: 0 20px; }
.modal footer { display: flex; gap: 8px; align-items: center; padding: 14px 20px 18px; flex-wrap: wrap; }
.sp { flex: 1; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
#toast[hidden] { display: none; }

.welcome { max-width: 640px; display: flex; flex-direction: column; gap: 14px; }
.welcome ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.loading { color: var(--muted); padding: 40px 0; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; gap: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .side-foot { margin: 0; flex-basis: 100%; }
  .main { padding: 16px 16px 40px; }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .col { max-height: none; flex-basis: 220px; }
  .filters input[type=search] { max-width: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .btn, .step { transition: border-color .12s, background-color .12s; }
}
</style>

<div class="layout">
  <aside class="side">
    <div class="brand"><span class="brand-mark">М</span><span>CRM Менти</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sync"></div>
  </aside>
  <main class="main" id="main"><p class="loading">Загружаю базу…</p></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
"use strict";
// ---------- Справочники ----------
const STUCK_DAYS = 14;
const STAGES = [
  ["new", "Новая заявка", "sales"], ["contacted", "Связались", "sales"], ["call", "Созвон", "sales"],
  ["waiting_payment", "Ждём оплату", "sales"], ["studying", "Обучается", "study"],
  ["final_project", "Итоговый проект", "study"], ["job_search", "Поиск работы", "job"],
  ["offer", "Оффер", "job"], ["probation_passed", "Прошёл испытательный", "job"], ["lost", "Отказ / выбыл", "closed"],
];
const SIDX = Object.fromEntries(STAGES.map((s, i) => [s[0], i]));
const SLABEL = Object.fromEntries(STAGES.map(s => [s[0], s[1]]));
const SGROUP = Object.fromEntries(STAGES.map(s => [s[0], s[2]]));
const EMPLOYED = ["offer", "probation_passed"];
const APP_ST = [["applied", "Отклик"], ["hr", "Скрининг HR"], ["test", "Тестовое"], ["interview", "Собеседование"], ["offer", "Оффер"], ["accepted", "Оффер принят"], ["rejected", "Отказ"]];
const APPL = Object.fromEntries(APP_ST);
const COLS = ["students", "cohorts", "partners", "payouts", "team", "reports"];

// ---------- Утилиты ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NF = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
const money = v => (v === null || v === undefined || v === "" || isNaN(v)) ? "—" : NF.format(Math.round(+v)) + " ₽";
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const daysAhead = n => dstr(new Date(Date.now() + n * 864e5));
const fDate = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : "—";
const fDay = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}` : "";
const fDT = iso => { if (!iso) return ""; const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fLocalDT = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)} ${s.slice(11, 16)}` : "";
const isoDay = iso => iso ? dstr(new Date(iso)) : "";
const daysSince = iso => iso ? Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 864e5)) : 0;
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
function plural(n, one, few, many) { n = Math.abs(n) % 100; const d = n % 10; if (n > 10 && n < 20) return many; if (d === 1) return one; if (d >= 2 && d <= 4) return few; return many; }
const days = n => `${n} ${plural(n, "день", "дня", "дней")}`;
function addMonths(s, n) { const [y, m, d] = s.split("-").map(Number); const first = new Date(y, m - 1 + n, 1); const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate(); first.setDate(Math.min(d, last)); return dstr(first); }
const initials = name => String(name || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const mask = name => { const p = String(name || "").split(/\s+/).filter(Boolean); return p.length >= 2 ? `${p[1]} ${p[0][0]}.` : (p[0] || ""); };
const num = v => (v === null || v === undefined || v === "" || isNaN(v)) ? null : Number(v);
const badge = st => `<span class="badge b-${SGROUP[st] || "sales"}">${esc(SLABEL[st] || st)}</span>`;
const sortBy = (arr, f) => [...arr].sort((a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; });

// ---------- Состояние ----------
const S = {
  status: "loading", mode: "staff", db: null, user: null, myId: null, isOwner: false, canWrite: null, readOnly: false,
  data: { students: [], cohorts: [], partners: [], payouts: [], team: [], reports: [] }, loaded: {},
  view: "dashboard", studentId: null, partnerId: null, reportId: null,
  f: { q: "", cohort: "", mentor: "", partner: "", stage: "" }, showLost: false, payTab: "overdue",
  pending: 0, names: {}, drag: null, busy: false,
};
try { const v = localStorage.getItem("crm-menti-view"); if (["dashboard", "board", "students", "payments", "partners", "settings"].includes(v)) S.view = v; } catch (e) { }

const D = () => S.data;
const stu = id => D().students.find(s => s.id === id);
const cohortName = id => D().cohorts.find(c => c.id === id)?.name || "";
const partnerById = id => D().partners.find(p => p.id === id);
const teamName = id => D().team.find(m => m.id === id)?.name || "";
const myTeam = () => S.myId ? D().team.find(m => m.userId === S.myId) : null;
function personName(uid) {
  if (!uid) return "автоматически";
  const t = D().team.find(m => m.userId === uid);
  return t ? t.name : (S.names[uid] || "Участник");
}

// ---------- Расчёты ----------
const paidSum = s => (s.payments || []).filter(p => p.paid).reduce((a, p) => a + (+p.amount || 0), 0);
const debt = s => s.price ? Math.max(s.price - paidSum(s), 0) : null;
const overdue = s => (s.payments || []).filter(p => !p.paid && p.due < today());
const isStuck = s => !["new", "lost", "probation_passed"].includes(s.stage) && daysSince(s.stageAt) >= STUCK_DAYS;
function reached(s) { let m = 0; for (const h of [...(s.history || []), { to: s.stage }]) { const i = SIDX[h.to]; if (h.to !== "lost" && i > m) m = i; } return m; }
function funnel(list) {
  const r = list.map(reached);
  return STAGES.filter(s => s[0] !== "lost").map((s, i) => { const c = r.filter(v => v >= i).length; return { label: s[1], count: c, pct: pct(c, list.length) }; });
}
function metrics(list) {
  const t = today(), month = t.slice(0, 8) + "01", in14 = daysAhead(14), in7 = daysAhead(7);
  const by = st => list.filter(s => s.stage === st).length;
  const paidStudents = list.filter(s => paidSum(s) > 0).length;
  const graduates = list.filter(s => reached(s) >= SIDX.job_search).length;
  const employed = list.filter(s => EMPLOYED.includes(s.stage));
  const sal = employed.map(s => s.jobSalary).filter(Boolean);
  const dto = employed.filter(s => s.offerDate && s.createdAt).map(s => daysBetween(isoDay(s.createdAt), s.offerDate));
  const pays = list.flatMap(s => (s.payments || []).map(p => ({ ...p, s })));
  const paid = pays.filter(p => p.paid);
  return {
    total: list.length, paidStudents, conv: pct(paidStudents, list.length),
    studying: by("studying") + by("final_project"), jobSearch: by("job_search"),
    graduates, employed: employed.length, rate: pct(employed.length, graduates),
    avgSalary: sal.length ? sal.reduce((a, b) => a + b, 0) / sal.length : null,
    avgDays: dto.length ? Math.round(dto.reduce((a, b) => a + b, 0) / dto.length) : null,
    revMonth: paid.filter(p => p.paid >= month).reduce((a, p) => a + (+p.amount || 0), 0),
    revTotal: paid.reduce((a, p) => a + (+p.amount || 0), 0),
    overdue: sortBy(pays.filter(p => !p.paid && p.due < t), p => p.due),
    upcoming: sortBy(pays.filter(p => !p.paid && p.due >= t && p.due <= in14), p => p.due),
    stuck: sortBy(list.filter(isStuck), s => s.stageAt).slice(0, 15),
    interviews: sortBy(list.flatMap(s => (s.apps || []).filter(a => a.interview && a.interview.slice(0, 10) >= t && a.interview.slice(0, 10) <= in7 && !["rejected", "accepted"].includes(a.status)).map(a => ({ ...a, s }))), a => a.interview),
    funnel: funnel(list),
  };
}
function partnerStats(p) {
  const list = sortBy(D().students.filter(s => s.partnerId === p.id), s => s.createdAt).reverse();
  const rows = list.map(s => { const paid = paidSum(s); const share = Math.round(paid * (s.partnerShare ?? p.share ?? 0)) / 100; return { s, paid, share }; });
  const payouts = sortBy(D().payouts.filter(x => x.partnerId === p.id), x => x.date).reverse();
  const accrued = rows.reduce((a, r) => a + r.share, 0);
  const paidOut = payouts.reduce((a, x) => a + (+x.amount || 0), 0);
  const paidStudents = rows.filter(r => r.paid > 0).length;
  return {
    list, rows, payouts, accrued, paidOut, balance: accrued - paidOut, leads: list.length, paidStudents,
    conv: pct(paidStudents, list.length), employed: list.filter(s => EMPLOYED.includes(s.stage)).length,
    revenue: rows.reduce((a, r) => a + r.paid, 0), funnel: funnel(list),
  };
}

// ---------- Фильтры ----------
function filtered() {
  const f = S.f, q = f.q.trim().toLowerCase(), me = myTeam();
  return D().students.filter(s => {
    if (q && ![s.name, s.phone, s.email, s.telegram].some(v => String(v || "").toLowerCase().includes(q))) return false;
    if (f.cohort === "none" ? s.cohortId : (f.cohort && s.cohortId !== f.cohort)) return false;
    if (f.mentor === "me" ? (!me || s.mentorId !== me.id) : (f.mentor && s.mentorId !== f.mentor)) return false;
    if (f.partner === "none" ? s.partnerId : (f.partner && s.partnerId !== f.partner)) return false;
    if (f.stage && s.stage !== f.stage) return false;
    return true;
  });
}
const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`;
function filtersHTML({ stage = false, lost = false } = {}) {
  const f = S.f, any = f.q || f.cohort || f.mentor || f.partner || f.stage;
  return `<div class="filters">

    <select id="f-mentor" data-filter="mentor" aria-label="Ментор">${opt("", "Все менторы", f.mentor)}${myTeam() ? opt("me", "Мои студенты", f.mentor) : ""}${D().team.map(m => opt(m.id, m.name, f.mentor)).join("")}</select>
    <select id="f-partner" data-filter="partner" aria-label="Источник">${opt("", "Все источники", f.partner)}${D().partners.map(p => opt(p.id, p.name, f.partner)).join("")}${opt("none", "Без партнёра", f.partner)}</select>
    ${stage ? `<select id="f-stage" data-filter="stage" aria-label="Этап">${opt("", "Все этапы", f.stage)}${STAGES.map(s => opt(s[0], s[1], f.stage)).join("")}</select>` : ""}
    ${lost ? `<label class="check"><input type="checkbox" id="f-lost" data-act="toggle-lost"${S.showLost ? " checked" : ""}> Показать выбывших</label>` : ""}
    ${any ? `<button class="btn ghost" data-act="freset">Сбросить</button>` : ""}
  </div>`;
}

let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render() {
  const active = document.activeElement, aid = active?.id, sel = active && "selectionStart" in active ? [active.selectionStart, active.selectionEnd] : null;
  const kept = {}; document.querySelectorAll("[data-keep]").forEach(el => kept[el.id] = el.value);
  $("#nav").innerHTML = navHTML();
  $("#main").innerHTML = mainHTML();
  for (const [id, v] of Object.entries(kept)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (aid && aid !== "mform" && !aid.startsWith("m-")) { const el = document.getElementById(aid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { } } }
  renderSync();
  resolveNames();
}
function renderSync() {
  const el = $("#sync"); if (!el) return;
  if (S.status !== "ready") { el.innerHTML = ""; return; }
  if (S.readOnly || S.mode === "partner") { el.innerHTML = `<span class="dot"></span>Только просмотр`; return; }

}

}
function mainHTML() {

  if (S.status === "nodb") return `<div class="card welcome"><h1>База недоступна</h1><p>Данные CRM хранятся в Claude. Откройте страницу по её ссылке, войдя в свой аккаунт Claude, чтобы видеть и сохранять записи.</p></div>`;
  if (S.status === "revoked") return `<div class="card welcome"><h1>Доступ закрыт</h1><p class="muted">Доступ к этой странице изменился. Обновите страницу.</p></div>`;
  if (S.mode === "partner") return reportView();

let namesBusy = false;
async function resolveNames() {
  if (!S.user || namesBusy || S.mode !== "staff") return;
  const ids = new Set();
  const s = S.view === "student" ? stu(S.studentId) : null;
  if (s) { (s.notes || []).forEach(n => n.by && ids.add(n.by)); (s.history || []).forEach(h => h.by && ids.add(h.by)); }
  const missing = [...ids].filter(i => !(i in S.names) && !D().team.some(m => m.userId === i));
  if (!missing.length) return;
  namesBusy = true;
  try { const ps = await S.user.profiles(missing); for (const i of missing) S.names[i] = ps[i]?.name || ""; }
  catch (e) { for (const i of missing) S.names[i] = ""; }
  namesBusy = false; scheduleRender();
}

// ---------- Запись в базу ----------
const queues = {};
function enqueue(key, fn) { const p = (queues[key] || Promise.resolve()).catch(() => { }).then(fn); queues[key] = p; return p; }
const ref = (col, id) => S.db.collection(col).doc(id);
const setDoc = (col, id, data) => enqueue(col + "/" + id, () => ref(col, id).set(clean(data)));
const updDoc = (col, id, patch) => enqueue(col + "/" + id, () => ref(col, id).update(clean(patch)));
const delDoc = (col, id) => enqueue(col + "/" + id, () => ref(col, id).delete());
const newId = col => S.db.collection(col).doc().id;
function clean(o) { return JSON.parse(JSON.stringify(o)); } // поля со значением undefined не записываются
async function save(fn, okMsg) {
  if (S.readOnly) { toast("У вас доступ только для просмотра"); return false; }
  S.pending++; renderSync();
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    console.warn(e);
    if (e && e.code === "invalid_argument" && S.canWrite !== true && !S.isOwner) { S.readOnly = true; toast("Нет прав на изменение данных"); scheduleRender(); }
    else if (e && e.code === "quota_exceeded") toast("База заполнена: удалите старые записи и попробуйте снова");
    else toast("Не удалось сохранить. Проверьте интернет и попробуйте ещё раз");
    return false;
  } finally { S.pending--; renderSync(); }
}
function stageChange(s, to, extra = {}) {
  const at = new Date().toISOString();
  return { stage: to, stageAt: at, history: [...(s.history || []), { from: s.stage, to, at, by: S.myId }], ...extra };
}
function moveStage(id, to, extra) {
  const s = stu(id); if (!s || s.stage === to) return;
  save(() => updDoc("students", id, stageChange(s, to, extra)), `Этап: ${SLABEL[to]}`);
}

// ---------- Окна с формами ----------
let MODAL = null;
function fieldsHTML(spec, vals) {
  let out = "", open = false;
  const close = () => open ? "</div></fieldset>" : "";
  for (const f of spec) {
    if (f.section !== undefined) { out += close() + `<fieldset>${f.section ? `<legend>${esc(f.section)}</legend>` : ""}<div class="fgrid">`; open = true; continue; }
    if (!open) { out += `<fieldset><div class="fgrid">`; open = true; }
    const id = "m-" + f.k, v = vals[f.k] ?? f.def ?? "", req = f.req ? " required" : "";
    let ctl;
    if (f.type === "select") ctl = `<select id="${id}" name="${f.k}">${f.options.map(([ov, ol]) => opt(ov, ol, String(v ?? ""))).join("")}</select>`;
    else if (f.type === "textarea") ctl = `<textarea id="${id}" name="${f.k}" rows="3">${esc(v)}</textarea>`;
    else if (f.type === "checkbox") { out += `<label class="field checkbox"><input type="checkbox" id="${id}" name="${f.k}"${v ? " checked" : ""}><span>${esc(f.label)}</span></label>`; continue; }
    else ctl = `<input id="${id}" name="${f.k}" type="${f.type || "text"}" value="${esc(v)}"${f.type === "number" ? ' step="any" min="0" inputmode="decimal"' : ""}${req}${f.ph ? ` placeholder="${esc(f.ph)}"` : ""}>`;
    out += `<label class="field${f.wide ? " span2" : ""}"><span>${esc(f.label)}${f.req ? " *" : ""}</span>${ctl}${f.help ? `<small>${esc(f.help)}</small>` : ""}</label>`;
  }
  return out + close();
}

    const p = src === p1 ? { id: p1, share: 40, promo: "BLOG1C", utm: "youtube" } : src === p2 ? { id: p2, share: 25, promo: "VKAT", utm: "telegram" } : null;
    W.push(["students", newId("students"), {
      name: `${last} ${first}`, phone: `+7 9${int(10, 99)} ${int(100, 999)}-${int(10, 99)}-${int(10, 99)}`, telegram: `@student${100 + i}`, email: "", city: pick(["Москва", "Казань", "Новосибирск", "Алматы", "Екатеринбург", "Минск"]), consent: true,
      stage, stageAt: hist[hist.length - 1].at, createdAt: hist[0].at, history: hist, lostReason: lost ? pick(["Дорого", "Не тянет по времени", "Передумал", "Не выходит на связь"]) : "",
      cohortId: cohort, mentorId: r() < .6 ? m1 : m2, price, partnerId: p?.id || null, partnerShare: p?.share || 0, promo: p?.promo || "", utmSource: p?.utm || "organic", utmCampaign: "",
      jobCompany: company, jobPosition: empl ? "Аналитик 1С" : "", jobSalary: salary, offerDate: empl ? dAgo(Math.max(tday, 1)) : null, comment: "",
      payments, apps, notes, demo: true,
    }]);
  }
  S.pending++; renderSync();
  let ok = true;
  for (const [c, id, d] of W) { try { await setDoc(c, id, d); } catch (e) { console.warn(e); ok = false; break; } }
  S.pending--; S.busy = false; renderSync();
  toast(ok ? "Пример загружен" : "Не всё удалось записать. Попробуйте ещё раз");
  if (ok) { S.view = "dashboard"; render(); }
}
async function clearDemo() {
  if (S.busy) return; S.busy = true; toast("Удаляю примеры…");
  S.pending++; renderSync();
  try { for (const c of COLS) for (const x of D()[c].filter(x => x.demo)) await delDoc(c, x.id); toast("Примеры удалены"); }
  catch (e) { console.warn(e); toast("Не удалось удалить всё. Попробуйте ещё раз"); }
  S.pending--; S.busy = false; renderSync();
  if (S.view === "student" || S.view === "partner") S.view = "dashboard";
  render();
}

// ---------- Уведомления ----------
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ---------- События ----------
function go(view) { S.view = view; try { localStorage.setItem("crm-menti-view", view); } catch (e) { } render(); window.scrollTo(0, 0); }
const ACT = {
  nav: d => go(d.v),
  open: d => { S.studentId = d.id; S.view = "student"; render(); window.scrollTo(0, 0); },
  "student-new": () => studentForm(null),
  "student-edit": d => studentForm(stu(d.id)),
  stage: d => moveStage(d.id, d.st),
  lost: d => lostForm(stu(d.id)),
  "pay-new": d => paymentForm(stu(d.id)),
  "pay-plan": d => planForm(stu(d.id)),
  "pay-edit": d => { const s = stu(d.id); paymentForm(s, (s.payments || []).find(p => p.id === d.pid)); },
  "pay-done": d => { const s = stu(d.id); save(() => updDoc("students", s.id, { payments: (s.payments || []).map(p => p.id === d.pid ? { ...p, paid: today() } : p) }), "Платёж отмечен оплаченным"); },
  "app-new": d => appForm(stu(d.id)),
  "app-edit": d => { const s = stu(d.id); appForm(s, (s.apps || []).find(a => a.id === d.aid)); },
  "note-add": d => {
    const el = document.getElementById("note-" + d.id), text = el.value.trim(); if (!text) return el.focus();
    const s = stu(d.id); el.value = "";
    save(() => updDoc("students", d.id, { notes: [...(s.notes || []), { id: newId("x"), text, at: new Date().toISOString(), by: S.myId }] }), "Заметка добавлена").then(ok => { if (!ok) { const e2 = document.getElementById("note-" + d.id); if (e2) e2.value = text; } });
  },
  paytab: d => { S.payTab = d.v; render(); },
  "partner-new": () => partnerForm(null),
  "partner-edit": d => partnerForm(partnerById(d.id)),
  "partner-open": d => { S.partnerId = d.id; S.view = "partner"; render(); window.scrollTo(0, 0); },
  "payout-new": d => payoutForm(partnerById(d.id)),
  "payout-del": (d, el) => { if (el.dataset.armed) return save(() => delDoc("payouts", d.id), "Выплата удалена"); el.dataset.armed = "1"; el.textContent = "Точно удалить?"; },
  "report-publish": d => publishReport(partnerById(d.id)),
  "report-tab": d => { S.reportId = d.id; render(); },
  "cohort-new": () => cohortForm(null), "cohort-edit": d => cohortForm(D().cohorts.find(c => c.id === d.id)),
  "team-new": () => teamForm(null), "team-edit": d => teamForm(D().team.find(m => m.id === d.id)),
  "team-me": d => save(async () => { for (const m of D().team.filter(m => m.userId === S.myId && m.id !== d.id)) await updDoc("team", m.id, { userId: null }); await updDoc("team", d.id, { userId: S.myId }); }, "Готово"),
  "demo-load": () => loadDemo(),
  "demo-clear": (d, el) => { if (el.dataset.armed) return clearDemo(); el.dataset.armed = "1"; el.textContent = "Нажмите ещё раз, чтобы удалить"; },
  freset: () => { S.f = { q: "", cohort: "", mentor: "", partner: "", stage: "" }; render(); },
  "toggle-lost": (d, el) => { S.showLost = el.checked; render(); },
  csv: () => exportCsv(),
  "m-close": () => closeModal(),
  "m-bg": (d, el, e) => { if (e.target === el) closeModal(); },
  "m-delete": async (d, el) => { if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Нажмите ещё раз для удаления"; return; } const r = await MODAL?.onDelete?.(); if (r !== false) closeModal(); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "toggle-lost") return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "BUTTON" || el.tagName === "A") e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.filter) { S.f[el.dataset.filter] = el.value; render(); }
  if (el.dataset.act === "toggle-lost") ACT["toggle-lost"](el.dataset, el);
});
let qT;
document.addEventListener("input", e => { if (e.target.id === "f-q") { S.f.q = e.target.value; clearTimeout(qT); qT = setTimeout(render, 180); } });
document.addEventListener("submit", e => { if (e.target.id === "mform") { e.preventDefault(); submitModal(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && MODAL) closeModal();
  if (e.key === "Enter" && e.target.classList?.contains("tile")) ACT.open(e.target.dataset);
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id?.startsWith("note-")) { const b = e.target.parentElement.querySelector("[data-act=note-add]"); b && b.click(); }
});
// Перетаскивание карточек на доске
document.addEventListener("dragstart", e => { const t = e.target.closest?.(".tile"); if (!t || S.readOnly) return; S.drag = t.dataset.id; t.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.dataset.id); });
document.addEventListener("dragend", () => { S.drag = null; document.querySelectorAll(".dragging, .col.drop").forEach(x => x.classList.remove("dragging", "drop")); });
document.addEventListener("dragover", e => { const c = e.target.closest?.(".col"); if (!c || !S.drag) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x => x !== c && x.classList.remove("drop")); c.classList.add("drop"); });
document.addEventListener("drop", e => {
  const c = e.target.closest?.(".col"); if (!c || !S.drag) return; e.preventDefault();
  const id = S.drag; S.drag = null; c.classList.remove("drop");
  if (c.dataset.stage === "lost") return lostForm(stu(id));
  moveStage(id, c.dataset.stage);
});

// ---------- Запуск ----------
async function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.status = "nodb"; return render(); }
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]).catch(() => [null, null]);
  if (!db) { S.status = "nodb"; return render(); }
  S.db = db; S.user = user;
  if (user) {
    try { const me = await user.me(); S.myId = me.id; S.isOwner = !!me.isOwner; } catch (e) { }
    try { S.canWrite = await user.can("data.write"); } catch (e) { S.canWrite = null; }
  }
  // Кто смотрит: сотрудник школы или партнёр с правом только на просмотр отчёта
  let staff = S.isOwner || S.canWrite === true;
  try {
    const cfg = db.doc("config/main"), snap = await cfg.get();
    if (S.isOwner && !snap.exists) await cfg.set({ createdAt: new Date().toISOString() });
    if (!staff) staff = snap.exists;
  } catch (e) { console.warn(e); }
  S.mode = staff ? "staff" : "partner";
  if (staff && S.canWrite === false && !S.isOwner) S.readOnly = true;
  const cols = S.mode === "partner" ? ["reports"] : COLS;
  for (const c of cols) {
    db.collection(c).onSnapshot(snap => {
      D()[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      S.loaded[c] = true; scheduleRender();
    }, err => {
      console.warn(c, err); S.loaded[c] = true;
      if (err && err.code === "revoked") S.status = "revoked";
      scheduleRender();
    });
  }
  S.status = "ready"; render();
}
boot();
</script>
