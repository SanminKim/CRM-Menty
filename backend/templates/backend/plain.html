<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}CRM Менти{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd21f'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' text-anchor='middle' fill='%231b1a17'%3E%D0%9C%3C/text%3E%3C/svg%3E">
<style>
:root { --bg: #f5f6f8; --surface: #fff; --border: #dfe2e8; --text: #13161b; --muted: #626a78; --brand: #2952e3; --brand-ink: #fff; --mark: #ffd21f; --danger: #c0362c; --ok: #1f7a4a; --warn: #8a5a00; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --surface: #181b21; --border: #2d323c; --text: #e7e9ee; --muted: #959dab; --brand: #7d9bff; --brand-ink: #0d1330; --danger: #f0857b; --ok: #6fcb97; --warn: #e3b556; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.card.wide { max-width: 560px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--mark); color: #1b1a17; display: grid; place-items: center; font-weight: 800; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
input[type=text], input[type=password], input[type=file] { font: inherit; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); width: 100%; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
button, .btn { font: inherit; font-weight: 600; padding: 10px 14px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brand-ink); cursor: pointer; text-align: center; text-decoration: none; }
a { color: var(--brand); }
.muted { color: var(--muted); font-size: 13px; }
.error { color: var(--danger); display: flex; flex-direction: column; gap: 6px; }
.warn { color: var(--warn); font-size: 13px; }
.pass { display: flex; gap: 6px; }
.pass input { flex: 1; min-width: 0; }
.pass .show { flex: none; font-weight: 500; font-size: 13px; padding: 0 12px; background: transparent; color: var(--brand); border: 1px solid var(--border); }
[hidden] { display: none !important; }
.ok { color: var(--ok); }
ul { margin: 0; padding-left: 18px; }
.errorlist { list-style: none; padding: 0; color: var(--danger); font-size: 13px; }
</style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
