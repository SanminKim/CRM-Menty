{% extends "crm/base.html" %}
{% block title %}Вход{% endblock %}
{% block anon %}
<div class="login-wrap">
  <form method="post" class="card login">
    {% csrf_token %}
    <div class="brand"><span class="brand-mark">М</span><span>Менторство&nbsp;1С</span></div>
    <h1>Вход в CRM</h1>
    {% if form.errors %}<p class="error">Неверный логин или пароль</p>{% endif %}
    <label>Логин<input type="text" name="username" autofocus required></label>
    <label>Пароль<input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary wide">Войти</button>
  </form>
</div>
{% endblock %}
