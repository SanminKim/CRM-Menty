<title>CRM Менти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Раскладка: тёмное узкое меню слева, светлая рабочая область, карточка студента выезжает панелью справа. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eceef2;
  --border: #dfe2e8;
  --text: #13161b;
  --muted: #626a78;
  --brand: #2952e3;
  --brand-ink: #ffffff;
  --brand-soft: #e5ebfd;
  --mark: #ffd21f;      /* жёлтая метка — отсылка к 1С */
  --mark-ink: #1b1a17;
  --side: #14171d;
  --side-2: #262b35;
  --side-text: #aab2c0;
  --side-ink: #ffffff;
  --side-muted: #8891a1;
  --hot: #e5484d;
  --danger: #c0362c;
  --danger-soft: #fbe6e3;
  --warn: #8a5a00;
  --warn-soft: #fbefd0;
  --ok: #1f7a4a;
  --ok-soft: #dcf1e5;
  --g-sales: #0b7a85;  --g-sales-soft: #dcf0f1;
  --g-study: #7446b8;  --g-study-soft: #ece4f7;
  --g-job: #1f7a4a;    --g-job-soft: #dcf1e5;
  --g-closed: #7c8492; --g-closed-soft: #e8eaee;
  --c1: #2952e3;       /* график: получено */
  --c2: #c8741c;       /* график: ожидается */
  --overlay: rgba(15, 18, 24, .42);
  --pop: 0 12px 36px rgba(15, 20, 30, .18);
  --font: "Golos Text", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --surface-2: #22262e; --border: #2d323c;
    --text: #e7e9ee; --muted: #959dab; --brand: #7d9bff; --brand-ink: #0d1330; --brand-soft: #1d2748;
    --side: #0a0c0f; --side-2: #1b1f27; --side-text: #9aa2b0; --side-ink: #ffffff; --side-muted: #6f7786; --hot: #e5484d;
    --danger: #f0857b; --danger-soft: #3a2120; --warn: #e3b556; --warn-soft: #372d1a; --ok: #6fcb97; --ok-soft: #183224;
    --g-sales: #4fc0cb; --g-sales-soft: #12333a; --g-study: #b998ee; --g-study-soft: #2a2140;
    --g-job: #6fcb97; --g-job-soft: #183224; --g-closed: #959dab; --g-closed-soft: #262a32;
    --c1: #5b82f5; --c2: #c97a2c;
    --overlay: rgba(0, 0, 0, .6); --pop: 0 12px 36px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --surface-2: #22262e; --border: #2d323c;
  --text: #e7e9ee; --muted: #959dab; --brand: #7d9bff; --brand-ink: #0d1330; --brand-soft: #1d2748;
  --side: #0a0c0f; --side-2: #1b1f27; --side-text: #9aa2b0; --side-ink: #ffffff; --side-muted: #6f7786; --hot: #e5484d;
  --danger: #f0857b; --danger-soft: #3a2120; --warn: #e3b556; --warn-soft: #372d1a; --ok: #6fcb97; --ok-soft: #183224;
  --g-sales: #4fc0cb; --g-sales-soft: #12333a; --g-study: #b998ee; --g-study-soft: #2a2140;
  --g-job: #6fcb97; --g-job-soft: #183224; --g-closed: #959dab; --g-closed-soft: #262a32;
  --c1: #5b82f5; --c2: #c97a2c;
  --overlay: rgba(0, 0, 0, .6); --pop: 0 12px 36px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html.locked { overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
a { color: var(--brand); }
h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
h1 small { color: var(--muted); font-weight: 400; font-size: 15px; letter-spacing: 0; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.right { margin-left: auto; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 14px 16px; }
.hint { color: var(--muted); font-size: 12.5px; }
.danger-text { color: var(--danger); }
.warn-text { color: var(--warn); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible, .tabs button:focus-visible, .link:focus-visible, .x:focus-visible, .nav button:focus-visible, .seg button:focus-visible, .chk:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Каркас */
.layout { display: grid; grid-template-columns: 204px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--side) 204px, var(--bg) 204px); }
.side { color: var(--side-text); padding: 16px 10px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; align-self: start; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; padding: 0 8px; font-size: 15px; color: var(--side-ink); }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--mark); color: var(--mark-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.gsearch { position: relative; }
.gsearch input { background: var(--side-2); border-color: transparent; padding: 6px 10px; color: var(--side-ink); }
.gsearch input::placeholder { color: var(--side-muted); }
.gsearch input:focus { outline: 2px solid var(--brand); border-color: transparent; }
#gq-res { color: var(--text); }
#gq-res { position: absolute; z-index: 12; left: 0; top: calc(100% + 4px); width: max(100%, 280px); max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--pop); padding: 4px; }
#gq-res button { all: unset; box-sizing: border-box; display: flex; gap: 8px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
#gq-res button:hover, #gq-res button.on { background: var(--surface-2); }
#gq-res .sub { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { all: unset; box-sizing: border-box; cursor: pointer; padding: 6px 10px; border-radius: 7px; color: var(--side-text); display: flex; align-items: center; gap: 8px; font-weight: 500; }
.nav button:hover { background: var(--side-2); color: var(--side-ink); }
.nav button.on { background: var(--side-2); color: var(--side-ink); font-weight: 600; }
.nav .n { margin-left: auto; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--side-2); color: var(--side-text); border-radius: 99px; padding: 0 7px; line-height: 18px; }
.nav button.on .n { background: rgba(255, 255, 255, .12); }
.nav .n.hot, .nav button.on .n.hot { background: var(--hot); color: #fff; }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--side-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.busy { background: var(--warn); }
.main { padding: 24px 28px 56px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head > div { min-width: 0; }
.page-head p { margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions select { width: auto; }
.back { all: unset; cursor: pointer; font-size: 13px; color: var(--muted); display: inline-block; margin-bottom: 4px; }
.back:hover { color: var(--text); }

/* Элементы */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; flex-wrap: wrap; }
.panel > header h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.panel > header .cnt { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.panel .pad { padding: 0 16px 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 7px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.btn.small { padding: 2px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.badge, .tag { display: inline-block; padding: 0 7px; border-radius: 5px; font-size: 12px; line-height: 20px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b-sales { background: var(--g-sales-soft); color: var(--g-sales); }
.b-study { background: var(--g-study-soft); color: var(--g-study); }
.b-job { background: var(--g-job-soft); color: var(--g-job); }
.b-closed { background: var(--g-closed-soft); color: var(--g-closed); }
.tag.ok, .tag.a-accepted, .tag.a-offer { background: var(--ok-soft); color: var(--ok); }
.tag.danger, .tag.a-rejected { background: var(--danger-soft); color: var(--danger); }
.tag.warn, .tag.a-interview, .tag.a-test { background: var(--warn-soft); color: var(--warn); }
.avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 9.5px; font-weight: 700; display: inline-grid; place-items: center; margin-left: auto; flex: none; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 9px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); margin-bottom: 16px; }
.banner p { flex: 1 1 260px; }
.link { all: unset; cursor: pointer; color: var(--brand); font-weight: 500; }
.link:hover { text-decoration: underline; }

input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
input[type=checkbox] { width: auto; accent-color: var(--brand); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters input[type=search] { flex: 1 1 220px; max-width: 280px; }
.filters select { width: auto; max-width: 100%; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.seg .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--text); border-color: var(--brand); font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
tfoot td { border-top: 1px solid var(--border); border-bottom: 0; font-weight: 600; }
.compact th, .compact td { padding: 6px 8px; }
.compact th:first-child, .compact td:first-child { padding-left: 0; }
.compact th:last-child, .compact td:last-child { padding-right: 0; }
.row-danger td { background: var(--danger-soft); }
.row-actions { text-align: right; white-space: nowrap; }
.sub { color: var(--muted); font-size: 12.5px; }

/* Списки дел */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 8px 16px; border-top: 1px solid var(--border); min-width: 0; }
.rows li.click { cursor: pointer; }
.rows li.click:hover { background: var(--surface-2); }
.rows li:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.rows .who { min-width: 0; flex: 1 1 150px; display: flex; flex-direction: column; }
.rows .who strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .who span { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .when { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows .when.late { color: var(--danger); font-weight: 600; }
.rows .acts { display: flex; gap: 6px; margin-left: auto; }
.rows .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.chk { all: unset; box-sizing: border-box; flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); cursor: pointer; display: grid; place-items: center; }
.chk:hover { border-color: var(--ok); background: var(--ok-soft); }
.chk:hover::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg) translateY(-1px); }
.today { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.allclear { padding: 22px 16px; color: var(--muted); border-top: 1px solid var(--border); }
.allclear strong { color: var(--text); display: block; font-weight: 600; }

/* Аналитика */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 1px; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); min-width: 0; }
.kpi.accent { background: var(--brand-soft); }
.kpi-label { color: var(--muted); font-size: 12.5px; }
.kpi-value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-sub { color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; margin-bottom: 16px; align-items: start; }
.funnel { display: flex; flex-direction: column; gap: 7px; }
.funnel-row { display: grid; grid-template-columns: minmax(96px, 160px) 1fr 74px; gap: 10px; align-items: center; }
.funnel-label { font-size: 13px; }
.funnel-bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.funnel-bar > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; min-width: 2px; }
.funnel-num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.funnel-num small { color: var(--muted); font-weight: 400; }

/* Доска */
.board-bar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.board-bar .filters { margin: 0; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(232px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 190px); min-width: 0; }
.col > header { display: flex; align-items: center; gap: 8px; padding: 9px 8px 5px 12px; font-weight: 600; font-size: 13px; }
.col > header::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--g-sales); flex: none; }
.col.g-study > header::before { background: var(--g-study); }
.col.g-job > header::before { background: var(--g-job); }
.col.g-closed > header::before { background: var(--g-closed); }
.count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.col-add { all: unset; cursor: pointer; margin-left: auto; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); font-size: 17px; line-height: 1; }
.col-add:hover { background: var(--surface); color: var(--text); }
.col-body { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 56px; }
.col-body .empty { padding: 8px 4px; font-size: 12.5px; }
.col.drop { outline: 2px dashed var(--brand); outline-offset: -2px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; cursor: grab; min-width: 0; }
.tile:hover { border-color: var(--brand); }
.tile.alert { box-shadow: inset 3px 0 0 var(--danger); }
.tile.dragging { opacity: .45; }
.tile strong { font-weight: 600; font-size: 13.5px; }
.tile-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.tile-step { font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.tile-step .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tile-step .d { margin-left: auto; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile-step.late .d { color: var(--danger); font-weight: 600; }
.tile-step.none { color: var(--warn); }
.tile-foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-top: 2px; flex-wrap: wrap; color: var(--muted); }
.tile-move { display: none; width: auto; align-self: flex-start; padding: 2px 6px; font-size: 12px; border-radius: 6px; max-width: 100%; color: var(--muted); }
@media (hover: none), (pointer: coarse) { .tile-move { display: block; } .tile { cursor: pointer; } }

/* Панель студента */
#drawer[hidden] { display: none; }
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 14; }
.drawer { position: fixed; z-index: 15; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--bg); border-left: 1px solid var(--border); box-shadow: var(--pop); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.d-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.d-head h2 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; min-width: 0; overflow-wrap: anywhere; flex: 1; }
.d-body { overflow-y: auto; padding: 16px 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; flex: 1; }
.d-stage { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-stage select { width: auto; font-weight: 600; }
.stepbox { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.stepbox .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stepbox .body span { color: var(--muted); font-size: 12.5px; }
.stepbox.late { border-color: var(--danger); }
.stepbox.late .body span { color: var(--danger); font-weight: 600; }
.stepbox.none { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 3px 11px; font: inherit; font-size: 13px; color: var(--text); cursor: pointer; text-decoration: none; max-width: 100%; overflow-wrap: anywhere; }
.chip:hover { border-color: var(--brand); }
.chip small { color: var(--muted); font-size: 11.5px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.sec > header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.sec > header h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.sec .box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 14px; }
.sec .box.flush { padding: 12px 14px; }
.sec .box .empty { padding: 10px 0; }

<script>
"use strict";
// ---------- Справочники ----------
const STUCK_DAYS = 14;
const STAGES = [
  ["new", "Новая заявка", "sales"], ["contacted", "Связались", "sales"], ["call", "Созвон", "sales"],
  ["waiting_payment", "Ждём оплату", "sales"], ["studying", "Обучается", "study"],
  ["final_project", "Итоговый проект", "study"], ["job_search", "Поиск работы", "job"],

];

const APP_ST = [["applied", "Отклик"], ["hr", "Скрининг HR"], ["test", "Тестовое"], ["interview", "Собеседование"], ["offer", "Оффер"], ["accepted", "Оффер принят"], ["rejected", "Отказ"]];

const STEP_HINTS = ["Связаться", "Созвон", "Написать про оплату", "Проверить домашку", "Ревью резюме", "Узнать итог собеседования", "Спросить, как дела"];
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

// ---------- Утилиты ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NF = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
const money = v => (v === null || v === undefined || v === "" || isNaN(v)) ? "—" : NF.format(Math.round(+v)) + " ₽";
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const daysAhead = n => { const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); };
const fDate = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : "—";
const fDay = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}` : "";
const fShort = s => s ? `${+s.slice(8, 10)} ${MON[+s.slice(5, 7) - 1]}` : "";
const fDT = iso => { if (!iso) return ""; const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fLocalDT = s => s ? `${fShort(s.slice(0, 10))}, ${s.slice(11, 16)}` : "";
const isoDay = iso => iso ? dstr(new Date(iso)) : "";
const daysSince = iso => iso ? Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 864e5)) : 0;
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
function plural(n, one, few, many) { n = Math.abs(n) % 100; const d = n % 10; if (n > 10 && n < 20) return many; if (d === 1) return one; if (d >= 2 && d <= 4) return few; return many; }
const days = n => `${n} ${plural(n, "день", "дня", "дней")}`;
// Подпись даты относительно сегодня: «сегодня», «завтра», «3 дн. назад», «5 окт»
function dueLabel(date) {
  const diff = daysBetween(today(), date);
  if (diff === 0) return "сегодня";
  if (diff === 1) return "завтра";
  if (diff === -1) return "вчера";
  if (diff < 0) return `${-diff} дн. назад`;
  return fShort(date);
}
function addMonths(s, n) { const [y, m, d] = s.split("-").map(Number); const first = new Date(y, m - 1 + n, 1); const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate(); first.setDate(Math.min(d, last)); return dstr(first); }
const initials = name => String(name || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const mask = name => { const p = String(name || "").split(/\s+/).filter(Boolean); return p.length >= 2 ? `${p[1]} ${p[0][0]}.` : (p[0] || ""); };
const num = v => (v === null || v === undefined || v === "" || isNaN(v)) ? null : Number(v);
const badge = st => `<span class="badge b-${SGROUP[st] || "sales"}">${esc(SLABEL[st] || st)}</span>`;
const sortBy = (arr, f) => [...arr].sort((a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; });
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };

// ---------- Состояние ----------
const S = {
  status: "loading", mode: "staff", db: null, user: null, myId: null, isOwner: false, canWrite: null, readOnly: false,
  data: { students: [], cohorts: [], partners: [], payouts: [], team: [], reports: [] }, loaded: {},
  view: "today", openId: null, partnerId: null, cohortId: null, reportId: null, pipe: "sales", anTab: "funnel", sel: new Set(), visible: [],
  f: { q: "", cohort: "", mentor: "", partner: "", stage: "" }, showLost: false, payTab: "overdue",
  config: {}, moreNoStep: false, histOpen: false, pending: 0, names: {}, drag: null, busy: false,
};
{
  const v = lsGet("crm-menti-view"); if (VIEWS.includes(v)) S.view = v;
  const p = lsGet("crm-menti-pipe"); if (PIPES.some(x => x[0] === p)) S.pipe = p;
}

const D = () => S.data;
const stu = id => D().students.find(s => s.id === id);
const cohortById = id => D().cohorts.find(c => c.id === id);
const cohortName = id => cohortById(id)?.name || "";
const partnerById = id => D().partners.find(p => p.id === id);
const teamName = id => D().team.find(m => m.id === id)?.name || "";
const myTeam = () => S.myId ? D().team.find(m => m.userId === S.myId) : null;
function personName(uid) {
  if (!uid) return "автоматически";
  const t = D().team.find(m => m.userId === uid);
  return t ? t.name : (S.names[uid] || "Участник");
}

// ---------- Расчёты ----------
const paidSum = s => sum((s.payments || []).filter(p => p.paid), p => p.amount);
const debt = s => s.price ? Math.max(s.price - paidSum(s), 0) : null;
const overdue = s => (s.payments || []).filter(p => !p.paid && p.due < today());
const isActive = s => s.stage !== "lost" && s.stage !== "probation_passed";
const hasStep = s => !!(s.next && s.next.text && s.next.date);
const stepLate = s => hasStep(s) && s.next.date < today();
const isStuck = s => !["new", "lost", "probation_passed"].includes(s.stage) && daysSince(s.stageAt) >= STUCK_DAYS;
// Прогресс по программе потока: сколько модулей отмечено у студента
const modulesOf = s => cohortById(s.cohortId)?.modules || [];
function progressOf(s) {
  const mods = modulesOf(s); if (!mods.length) return null;
  const done = mods.filter(m => s.progress && s.progress[m.id]).length;
  return { done, total: mods.length, pct: pct(done, mods.length) };
}
const progHTML = (p, wide = false) => p ? `<span class="prog${wide ? " wide" : ""}" title="Пройдено модулей: ${esc(p.done)} из ${esc(p.total)}"><span class="prog-bar"><span style="width:${+p.pct || 0}%"></span></span><span>${esc(p.done)}/${esc(p.total)}</span></span>` : "";
function reached(s) { let m = 0; for (const h of [...(s.history || []), { to: s.stage }]) { const i = SIDX[h.to]; if (h.to !== "lost" && i > m) m = i; } return m; }
function funnel(list) {
  const r = list.map(reached);
  return STAGES.filter(s => s[0] !== "lost").map((s, i) => { const c = r.filter(v => v >= i).length; return { label: s[1], count: c, pct: pct(c, list.length) }; });
}
function metrics(list) {
  const month = today().slice(0, 8) + "01";
  const by = st => list.filter(s => s.stage === st).length;
  const paidStudents = list.filter(s => paidSum(s) > 0).length;
  const graduates = list.filter(s => reached(s) >= SIDX.job_search).length;
  const employed = list.filter(s => EMPLOYED.includes(s.stage));
  const sal = employed.map(s => s.jobSalary).filter(Boolean);
  const dto = employed.filter(s => s.offerDate && s.createdAt).map(s => daysBetween(isoDay(s.createdAt), s.offerDate));
  const paid = list.flatMap(s => (s.payments || []).filter(p => p.paid));
  const lost = list.filter(s => s.stage === "lost");
  const reasons = {};
  for (const s of lost) { const k = (s.lostReason || "").trim() || "Причина не указана"; reasons[k] = (reasons[k] || 0) + 1; }
  return {
    total: list.length, paidStudents, conv: pct(paidStudents, list.length),
    studying: by("studying") + by("final_project"), jobSearch: by("job_search"),
    graduates, employed: employed.length, rate: pct(employed.length, graduates),
    avgSalary: sal.length ? sum(sal, x => x) / sal.length : null,
    avgDays: dto.length ? Math.round(sum(dto, x => x) / dto.length) : null,
    revMonth: sum(paid.filter(p => p.paid >= month), p => p.amount), revTotal: sum(paid, p => p.amount),
    stuck: sortBy(list.filter(isStuck), s => s.stageAt).slice(0, 12),
    lost: lost.length, reasons: Object.entries(reasons).sort((a, b) => b[1] - a[1]),
    funnel: funnel(list),
  };
}
// Что требует внимания: шаги, платежи, собеседования, студенты без шага
function agenda(list) {
  const t = today(), in3 = daysAhead(3), in7 = daysAhead(7);
  const act = list.filter(isActive);
  const stepped = sortBy(act.filter(hasStep), s => s.next.date);
  const pays = list.filter(s => s.stage !== "lost").flatMap(s => (s.payments || []).filter(p => !p.paid).map(p => ({ ...p, s })));
  const apps = act.flatMap(s => (s.apps || []).filter(a => a.interview && !["rejected", "accepted"].includes(a.status)).map(a => ({ ...a, s })));
  return {
    due: stepped.filter(s => s.next.date <= t),
    week: stepped.filter(s => s.next.date > t && s.next.date <= in7),
    noStep: sortBy(act.filter(s => !hasStep(s)), s => s.stageAt || ""),
    pays: sortBy(pays.filter(p => p.due <= in3), p => p.due),
    interviews: sortBy(apps.filter(a => a.interview.slice(0, 10) >= t && a.interview.slice(0, 10) <= in7), a => a.interview),
  };
}
const shareOf = s => { const p = partnerById(s.partnerId); return p ? Math.round(paidSum(s) * (s.partnerShare ?? p.share ?? 0)) / 100 : 0; };
// Деньги: получено и ожидается по месяцам, сравнение источников и потоков
function finance(list) {
  const t = today(), now = new Date(), months = [];
  for (let i = -5; i <= 6; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); months.push({ key: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, label: MON[d.getMonth()].slice(0, 3), year: d.getFullYear(), got: 0, exp: 0, cur: i === 0 }); }
  const byKey = Object.fromEntries(months.map(m => [m.key, m]));
  const pays = list.flatMap(s => (s.payments || []).map(p => ({ ...p, s })));
  const paid = pays.filter(p => p.paid), open = pays.filter(p => !p.paid && p.s.stage !== "lost");
  for (const p of paid) { const m = byKey[p.paid.slice(0, 7)]; if (m) m.got += +p.amount || 0; }
  for (const p of open) if (p.due >= t) { const m = byKey[p.due.slice(0, 7)]; if (m) m.exp += +p.amount || 0; }
  const payers = list.filter(s => paidSum(s) > 0).length, total = sum(paid, p => p.amount);
  const group = (rows, name) => {
    const pay = rows.filter(s => paidSum(s) > 0).length, rev = sum(rows, paidSum), cost = sum(rows, shareOf);
    return { name, leads: rows.length, payers: pay, conv: pct(pay, rows.length), revenue: rev, cost, net: rev - cost,
      expected: sum(rows.filter(s => s.stage !== "lost").flatMap(s => (s.payments || []).filter(p => !p.paid && p.due >= t)), p => p.amount),
      employed: rows.filter(s => EMPLOYED.includes(s.stage)).length };
  };

function partnerStats(p) {

function barPath(x, y, w, h, r) {

}
const fmtK = v => v >= 1e6 ? `${(v / 1e6).toFixed(v % 1e6 ? 1 : 0).replace(".", ",")}\u00a0млн` : v >= 1000 ? `${String(+(v / 1000).toFixed(2)).replace(".", ",")}\u00a0тыс.` : String(Math.round(v));

// Столбцы по месяцам: получено и ожидается сложены в один столбец, между ними зазор
function moneyChart(months) {
  const W = 720, H = 230, L = 52, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const top = niceMax(Math.max(...months.map(m => m.got + m.exp))), y = v => T + ph - v / top * ph;
  const step = pw / months.length, bw = Math.min(30, step * .56);
  const grid = [0, .25, .5, .75, 1].map(k => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(top * k)}" y2="${y(top * k)}"></line><text x="${L - 8}" y="${y(top * k) + 4}" text-anchor="end">${k ? fmtK(top * k) : "0"}</text>`).join("");
  const bars = months.map((m, i) => {
    const x = L + step * i + (step - bw) / 2, hg = m.got / top * ph, he = m.exp / top * ph, gap = hg > 0 && he > 0 ? 2 : 0;
    const tip = `${m.label} ${m.year}${m.got ? `\nПолучено: ${money(m.got)}` : ""}${m.exp ? `\nОжидается: ${money(m.exp)}` : ""}${!m.got && !m.exp ? "\nНет платежей" : ""}`;
    return `<g data-tip="${esc(tip)}"><rect class="hit" x="${L + step * i}" y="${T}" width="${step}" height="${ph}"></rect>
      ${hg > 0 ? `<path class="s1" d="${barPath(x, y(m.got), bw, hg, he > 0 ? 0 : 4)}"></path>` : ""}
      ${he > 0 ? `<path class="s2" d="${barPath(x, y(m.got + m.exp), bw, Math.max(he - gap, 1), 4)}"></path>` : ""}
      <text class="${m.cur ? "now" : ""}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${m.label}</text></g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Получено и ожидается по месяцам">${grid}${bars}</svg>`;
}

// ----- Воронка -----
function boardView() {

  const inPipe = k => list.filter(s => k === "all" ? s.stage !== "lost" : SGROUP[s.stage] === k).length;
  const stages = STAGES.filter(s => (S.pipe === "all" ? s[2] !== "closed" : s[2] === S.pipe) || (S.showLost && s[0] === "lost"));
  const cols = stages.map(([st, label, g]) => {
    const items = sortBy(list.filter(s => s.stage === st), s => (hasStep(s) ? s.next.date : "9999") + (s.stageAt || ""));
    return `<section class="col g-${g}" data-stage="${st}"><header><span>${label}</span><span class="count">${items.length}</span>${st !== "lost" ? `<button class="col-add" data-act="quick" data-st="${st}" aria-label="Добавить в «${label}»" title="Добавить">+</button>` : ""}</header>
      <div class="col-body">${items.map(tileHTML).join("") || `<p class="empty">Пусто</p>`}</div></section>`;

  <div class="board-bar">
    <div class="seg" role="tablist">${PIPES.map(([k, l]) => `<button data-act="pipe" data-v="${k}" class="${S.pipe === k ? "on" : ""}" role="tab" aria-selected="${S.pipe === k}">${l}<span class="n">${inPipe(k)}</span></button>`).join("")}</div>

}
function tileHTML(s) {

  const mentor = teamName(s.mentorId);
  const step = hasStep(s) ? `<span class="tile-step${late ? " late" : ""}"><span class="t">${esc(s.next.text)}</span><span class="d">${dueLabel(s.next.date)}</span></span>`
    : isActive(s) ? `<span class="tile-step none">Нет следующего шага</span>` : "";

    <strong>${esc(s.name)}</strong>${meta ? `<span class="tile-meta">${esc(meta)}</span>` : ""}${step}
    <span class="tile-foot"><span>${daysSince(s.stageAt)} дн. на этапе</span>${SGROUP[s.stage] === "study" ? progHTML(progressOf(s)) : ""}${od ? `<span class="tag danger">просрочен платёж</span>` : ""}${s.demo ? `<span class="tag">пример</span>` : ""}${mentor ? `<span class="avatar" title="${esc(mentor)}">${esc(initials(mentor))}</span>` : ""}</span>
    <select class="tile-move" data-move="${esc(s.id)}" data-stop aria-label="Сменить этап">${STAGES.map(x => opt(x[0], x[1], s.stage)).join("")}</select>

function listView() {

// ----- Потоки -----
function cohortStats(c) {
  const list = D().students.filter(s => s.cohortId === c.id), act = list.filter(s => s.stage !== "lost");
  const studying = act.filter(s => SGROUP[s.stage] !== "sales"), progs = studying.map(progressOf).filter(Boolean);
  const open = act.flatMap(s => (s.payments || []).filter(p => !p.paid));
  return {
    list, act, studying, leads: act.length - studying.length, mods: c.modules || [], avg: progs.length ? Math.round(sum(progs, p => p.pct) / progs.length) : null,
    paid: sum(act, paidSum), price: sum(act, s => s.price), overdue: sum(open.filter(p => p.due < today()), p => p.amount),
    noStep: act.filter(s => isActive(s) && !hasStep(s)).length, employed: act.filter(s => EMPLOYED.includes(s.stage)).length,
  };
}

        <dt>Прогресс</dt><dd>${st.avg !== null ? `<span class="prog wide"><span class="prog-bar"><span style="width:${st.avg}%"></span></span><span>${st.avg}%</span></span>` : `<span class="sub">${st.mods.length ? "нет отметок" : "программа не задана"}</span>`}</dd>

        ${st.overdue ? `<dt>Просрочено</dt><dd class="danger-text">${money(st.overdue)}</dd>` : ""}</dl></button>`; }).join("")}</div>`
      : `<div class="card welcome"><h2>Потоков пока нет</h2><p class="muted">Поток объединяет группу студентов: общие даты, цена и программа из модулей. По модулям отмечается прогресс каждого студента.</p><div class="actions"><button class="btn primary" data-act="cohort-new">+ Поток</button></div></div>`) +

// ---------- Запись в базу ----------
const queues = {};
function enqueue(key, fn) { const p = (queues[key] || Promise.resolve()).catch(() => { }).then(fn); queues[key] = p; return p; }
const ref = (col, id) => S.db.collection(col).doc(id);
const setDoc = (col, id, data) => enqueue(col + "/" + id, () => ref(col, id).set(clean(data)));
const updDoc = (col, id, patch) => enqueue(col + "/" + id, () => ref(col, id).update(clean(patch)));
// Правка студента: патч считается от актуальной записи в момент выполнения, а не в момент клика
function patchStudent(id, fn) {
  return enqueue("students/" + id, async () => {
    const cur = stu(id); if (!cur) throw { code: "gone" };
    const patch = fn(cur); if (!patch) return;
    await ref("students", id).update(clean(patch));
    // Следующая правка в очереди увидит это изменение, не дожидаясь ответа базы. Вложенные объекты база сливает по ключам.
    const local = { ...patch }; if (patch.progress) local.progress = { ...(cur.progress || {}), ...patch.progress };
    Object.assign(cur, local);
  });
}
const delDoc = (col, id) => enqueue(col + "/" + id, () => ref(col, id).delete());
const newId = col => S.db.collection(col).doc().id;
function clean(o) { return JSON.parse(JSON.stringify(o)); } // поля со значением undefined не записываются
async function save(fn, okMsg) {
  if (S.readOnly) { toast("У вас доступ только для просмотра"); return false; }
  S.pending++; renderSync();
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    console.warn(e);
    if (e && e.code === "invalid_argument" && S.canWrite !== true && !S.isOwner) { S.readOnly = true; toast("Нет прав на изменение данных"); scheduleRender(); }
    else if (e && e.code === "gone") { toast("Этого студента уже удалили"); scheduleRender(); }
    else if (e && e.code === "quota_exceeded") toast("База заполнена: удалите старые записи и попробуйте снова");
    else toast("Не удалось сохранить. Проверьте интернет и попробуйте ещё раз");
    return false;
  } finally { S.pending--; renderSync(); }
}
function stageChange(s, to, extra = {}) {
  const at = new Date().toISOString();
  return { stage: to, stageAt: at, history: [...(s.history || []), { from: s.stage, to, at, by: S.myId }], ...extra };
}
// Смена этапа с возможностью отменить: в «Отменить» уходит прежнее состояние записи
async function moveStage(id, to, extra = {}) {
  const s = stu(id); if (!s || s.stage === to) return false;
  const prev = { stage: s.stage, stageAt: s.stageAt || null, lostReason: s.lostReason || "", next: s.next || null };
  let at = null;
  const ok = await save(() => patchStudent(id, cur => { if (cur.stage === to) return null; const p = stageChange(cur, to, extra); at = p.stageAt; return p; }));
  if (ok && at) toast(`${mask(s.name) || s.name}: ${SLABEL[to]}`, () => save(() => patchStudent(id, cur => {
    // Убираем только свою запись из истории: чужие правки, сделанные за это время, остаются
    const back = { stage: prev.stage, stageAt: prev.stageAt, lostReason: prev.lostReason, history: (cur.history || []).filter(h => !(h.at === at && h.to === to)) };
    if ("next" in extra) back.next = cur.next || prev.next;
    return back;
  }), "Этап возвращён"));
  return ok;
}
async function stepDone(id) {
  const s = stu(id); if (!s || !hasStep(s)) return;
  const step = s.next;
  const note = { id: newId("x"), text: `Сделано: ${step.text}`, at: new Date().toISOString(), by: S.myId, kind: "step" };
  const ok = await save(() => patchStudent(id, cur => ({ next: null, notes: [...(cur.notes || []), note] })));
  if (!ok) return;
  toast("Шаг выполнен", () => save(() => patchStudent(id, cur => ({ next: hasStep(cur) ? cur.next : step, notes: (cur.notes || []).filter(n => n.id !== note.id) })), "Шаг возвращён"));
  if (isActive(s)) stepForm(s, true);
}
// Готовый текст напоминания об оплате: копируется в буфер, остаётся вставить в Telegram
function remindText(s, p) {
  const parts = String(s.name || "").split(/\s+/).filter(Boolean), first = parts[1] || parts[0] || "";
  const late = p.due < today();
  return `${first ? first + ", д" : "Д"}обрый день! Напоминаю про платёж за обучение: ${money(p.amount).replace(/[\u00a0\u202f]/g, " ")}, срок ${late ? "был " : ""}${fDate(p.due)}. ${late ? "Подскажите, пожалуйста, когда получится оплатить?" : "Если уже оплатили, дайте знать, я отмечу."}`;
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) { openModal({ title: "Скопируйте текст", submit: "Готово", cancel: "Закрыть", values: { text }, fields: [{ k: "text", label: "Текст", type: "textarea", wide: true }], onSubmit: () => true }); }
}
function toggleModule(id, mid) {
  return save(() => patchStudent(id, cur => ({ progress: { [mid]: cur.progress && cur.progress[mid] ? null : today() } })));
}
async function payDone(id, pid) {
  const s = stu(id); if (!s) return;
  const mark = paid => cur => ({ payments: (cur.payments || []).map(p => p.id === pid ? { ...p, paid } : p) });
  const ok = await save(() => patchStudent(id, mark(today())));
  if (ok) toast("Платёж отмечен оплаченным", () => save(() => patchStudent(id, mark(null)), "Отметка снята"));
}

let MODAL = null;
function fieldsHTML(spec, vals) {
  let out = "", open = false;
  const close = () => open ? "</div></fieldset>" : "";
  for (const f of spec) {

// Массовый ввод: строки из таблицы или CSV. В каждой строке ищем имя, контакты и источник.
function splitRow(line) {
  const delim = line.includes("\t") ? "\t" : line.includes(";") ? ";" : ",";
  const cells = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {

}
function parseLeads(text, defPartner) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, 300);
  const low = x => String(x || "").trim().toLowerCase(), seen = new Set(), out = [];
  const partners = D().partners.filter(p => p.active !== false);
  const key = c => { const k = [c.phone && "p" + c.phone.replace(/\D/g, "").slice(-10), c.email && "e" + low(c.email), c.telegram && "t" + low(c.telegram).replace(/^@/, "")].filter(Boolean); return k.length ? k : ["n" + low(c.name)]; };
  lines.forEach((line, n) => {
    const cells = splitRow(line);
    if (n === 0 && cells.some(x => /^(имя|фио|name|телефон|phone|e-?mail|почта|telegram|телеграм|контакт|источник)$/i.test(x))) return;
    const r = { name: "", phone: "", telegram: "", email: "", partnerId: defPartner || null }, words = [];
    for (const cell of cells) {

      else if (/^\+?[\d\s()\-]{6,}$/.test(cell)) r.phone = r.phone || cell;
      else if (/^@[A-Za-z0-9_]{3,}$/.test(cell) || /^https?:\/\/t\.me\//i.test(cell)) r.telegram = r.telegram || parseContact(cell).telegram;
      else words.push(cell);
    }
    // Источник: промокод или utm распознаём всегда, название партнёра — только если в строке есть ещё и имя
    const pi = words.findIndex(w => partners.some(p => [p.promo, p.utm].some(v => v && low(v) === low(w)) || (words.length > 1 && low(p.name) === low(w))));
    if (pi >= 0) { const w = words.splice(pi, 1)[0]; r.partnerId = partners.find(p => [p.promo, p.utm, p.name].some(v => v && low(v) === low(w))).id; }

    if (!r.name) return;
    const keys = key(r), contact = r.phone || r.email || r.telegram;
    const dup = contact ? findDuplicate(r) : D().students.find(s => low(s.name) === low(r.name));
    r.status = dup ? "dup" : keys.some(k => seen.has(k)) ? "repeat" : "new";
    r.note = dup ? `уже есть: ${dup.name}` : r.status === "repeat" ? "повтор в списке" : "новая";
    keys.forEach(k => seen.add(k)); out.push(r);

}

// Модули из текста формы. Совпавшие по названию сохраняют id, а значит и отметки студентов.
// Если исчезло ровно одно старое название и на его месте появилось ровно одно новое, это переименование.
function mergeModules(old, text) {
  const titles = String(text || "").split(/\r?\n/).map(x => x.trim()).filter(Boolean).slice(0, 40);
  const pool = new Map(); for (const m of old) { if (!pool.has(m.title)) pool.set(m.title, []); pool.get(m.title).push(m.id); }
  const out = titles.map(t => ({ id: pool.get(t)?.shift() || null, title: t }));
  const gone = [...pool.values()].flat(), fresh = out.filter(m => !m.id);
  // Переименование — только если новое название стоит на месте исчезнувшего; иначе это удаление и добавление
  if (gone.length === 1 && fresh.length === 1 && old.findIndex(m => m.id === gone[0]) === out.indexOf(fresh[0])) fresh[0].id = gone[0];
  fresh.forEach(m => { if (!m.id) m.id = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); });
  return out;
}

  "d-close": () => { S.openId = null; render(); },
  pipe: d => { S.pipe = d.v; lsSet("crm-menti-pipe", d.v); render(); },
  quick: d => quickForm(d.st || "new"),
  import: () => importForm(),
  antab: d => { S.anTab = d.v; render(); },
  "cohort-open": d => { S.cohortId = d.id; S.sel.clear(); S.view = "cohort"; render(); window.scrollTo(0, 0); },
  "list-nocohort": () => { S.f = { q: "", cohort: "none", mentor: "", partner: "", stage: "" }; go("students"); },
  "mod-toggle": d => toggleModule(d.id, d.mid),
  bulk: d => bulkForm(d.kind),
  "sel-clear": () => { S.sel.clear(); render(); },
  "student-edit": d => studentForm(stu(d.id)),
  "step-edit": d => stepForm(stu(d.id)),
  "step-done": d => stepDone(d.id),
  "more-nostep": () => { S.moreNoStep = !S.moreNoStep; render(); },
  qdate: d => { const el = document.getElementById(d.target); if (el) el.value = daysAhead(+d.days); },
  copy: d => copyText(d.text, "Скопировано"),
  "pay-remind": d => { const s = stu(d.id), p = (s?.payments || []).find(x => x.id === d.pid); if (p) copyText(remindText(s, p), "Напоминание скопировано. Вставьте его в переписку"); },
  "pay-new": d => paymentForm(stu(d.id)),
  "pay-plan": d => planForm(stu(d.id)),
  "pay-edit": d => { const s = stu(d.id); paymentForm(s, (s.payments || []).find(p => p.id === d.pid)); },
  "pay-done": d => payDone(d.id, d.pid),
  "app-new": d => appForm(stu(d.id)),
  "app-edit": d => { const s = stu(d.id); appForm(s, (s.apps || []).find(a => a.id === d.aid)); },
  "note-add": d => {
    const el = document.getElementById("note-" + d.id), text = el.value.trim(); if (!text) return el.focus();
    const note = { id: newId("x"), text, at: new Date().toISOString(), by: S.myId }; el.value = "";
    save(() => patchStudent(d.id, cur => ({ notes: [...(cur.notes || []), note] })), "Заметка добавлена").then(ok => { if (!ok) { const e2 = document.getElementById("note-" + d.id); if (e2) e2.value = text; } });
  },
  paytab: d => { S.payTab = d.v; render(); },
  "partner-new": () => partnerForm(null),
  "partner-edit": d => partnerForm(partnerById(d.id)),
  "partner-open": d => { S.partnerId = d.id; S.view = "partner"; render(); window.scrollTo(0, 0); },
  "payout-new": d => payoutForm(partnerById(d.id)),
  "payout-del": (d, el) => { if (el.dataset.armed) return save(() => delDoc("payouts", d.id), "Выплата удалена"); el.dataset.armed = "1"; el.textContent = "Точно удалить?"; },
  "report-publish": d => publishReport(partnerById(d.id)),
  "report-tab": d => { S.reportId = d.id; render(); },
  "cohort-new": () => cohortForm(null), "cohort-edit": d => cohortForm(D().cohorts.find(c => c.id === d.id)),
  "team-new": () => teamForm(null), "team-edit": d => teamForm(D().team.find(m => m.id === d.id)),
  "team-me": d => save(async () => { for (const m of D().team.filter(m => m.userId === S.myId && m.id !== d.id)) await updDoc("team", m.id, { userId: null }); await updDoc("team", d.id, { userId: S.myId }); }, "Готово"),
  "demo-load": () => loadDemo(),
  "demo-clear": (d, el) => { if (el.dataset.armed) return clearDemo(); el.dataset.armed = "1"; el.textContent = "Нажмите ещё раз, чтобы удалить"; },
  freset: () => { S.f = { q: "", cohort: "", mentor: "", partner: "", stage: "" }; render(); },
  csv: () => exportCsv(),
  backup: () => exportBackup(),
  undo: () => { const f = UNDO; UNDO = null; $("#toast").hidden = true; f && f(); },
  "m-close": () => closeModal(),
  "m-bg": (d, el, e) => { if (e.target === el) closeModal(); },
  "m-link": () => { const l = MODAL?.link, v = collect(); closeModal(); l && l.go(v); },
  "m-delete": async (d, el) => { if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Нажмите ещё раз"; return; } const r = await MODAL?.onDelete?.(); if (r !== false) closeModal(); },
};
document.addEventListener("click", e => {
  if (!e.target.closest("#gsearch")) $("#gq-res").hidden = true;
  const stop = e.target.closest("[data-stop]"); if (stop) return;
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "toggle-lost") return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "BUTTON") e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.filter) { S.f[el.dataset.filter] = el.value; render(); }
  if (el.dataset.act === "toggle-lost") { S.showLost = el.checked; render(); }
  if (el.dataset.mod) toggleModule(el.dataset.sid, el.dataset.mod).then(ok => { if (!ok) scheduleRender(); });
  if (el.dataset.sel) { el.checked ? S.sel.add(el.dataset.sel) : S.sel.delete(el.dataset.sel); render(); }
  if ("selAll" in el.dataset) { for (const id of el.dataset.ids.split(",").filter(Boolean)) el.checked ? S.sel.add(id) : S.sel.delete(id); render(); }
  if (MODAL?.onInput && el.closest("#mform")) MODAL.onInput();
  if (el.dataset.move) {
    const s = stu(el.dataset.move), to = el.value; if (!s || to === s.stage) return;
    if (to === "lost") { el.value = s.stage; lostForm(s); } else moveStage(s.id, to).then(ok => { if (!ok) scheduleRender(); });
  }
});
let qT;
document.addEventListener("input", e => {
  if (e.target.id === "f-q") { S.f.q = e.target.value; clearTimeout(qT); qT = setTimeout(render, 180); }
  if (e.target.id === "gq") renderSearch();
  if (MODAL?.onInput && e.target.closest("#mform")) MODAL.onInput();
});
// Подсказка над столбцом графика
document.addEventListener("mousemove", e => {
  const g = e.target.closest?.("[data-tip]"), tip = $("#tip");
  if (!g) { tip.hidden = true; return; }
  tip.textContent = g.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + "px";
});
document.addEventListener("focusin", e => { if (e.target.id === "gq") renderSearch(); });
document.addEventListener("toggle", e => { if (e.target.id === "d-hist") S.histOpen = e.target.open; }, true);
document.addEventListener("submit", e => { if (e.target.id === "mform") { e.preventDefault(); submitModal(); } });
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Escape") {
    if (MODAL) closeModal();
    else if (e.target.id === "gq") { closeSearch(); e.target.blur(); }
    else if (S.openId) { S.openId = null; render(); }
  }
  if (e.key === "/" && !typing && !MODAL && !$("#gsearch").hidden) { e.preventDefault(); $("#gq").focus(); }
  if (e.key === "Enter" && e.target.id === "gq") { e.preventDefault(); const first = $("#gq-res button"); if (first) openStudent(first.dataset.id); }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("tile")) { e.preventDefault(); openStudent(e.target.dataset.id); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id?.startsWith("note-")) { const b = e.target.parentElement.querySelector("[data-act=note-add]"); b && b.click(); }
});
// Перетаскивание карточек на доске
document.addEventListener("dragstart", e => { const t = e.target.closest?.(".tile"); if (!t || S.readOnly) return; S.drag = t.dataset.id; t.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.dataset.id); });
document.addEventListener("dragend", () => { S.drag = null; document.querySelectorAll(".dragging, .col.drop").forEach(x => x.classList.remove("dragging", "drop")); });
document.addEventListener("dragover", e => { const c = e.target.closest?.(".col"); if (!c || !S.drag) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x => x !== c && x.classList.remove("drop")); c.classList.add("drop"); });
document.addEventListener("drop", e => {
  const c = e.target.closest?.(".col"); if (!c || !S.drag) return; e.preventDefault();
  const id = S.drag; S.drag = null; c.classList.remove("drop");
  if (c.dataset.stage === "lost") return lostForm(stu(id));
  moveStage(id, c.dataset.stage);
});

// ---------- Запуск ----------
async function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.status = "nodb"; return render(); }
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]).catch(() => [null, null]);
  if (!db) { S.status = "nodb"; return render(); }
  S.db = db; S.user = user;
  if (user) {
    try { const me = await user.me(); S.myId = me.id; S.isOwner = !!me.isOwner; } catch (e) { }
    try { S.canWrite = await user.can("data.write"); } catch (e) { S.canWrite = null; }
  }
  // Кто смотрит: сотрудник школы или партнёр с правом только на просмотр отчёта
  let staff = S.isOwner || S.canWrite === true;
  try {
    const cfg = db.doc("config/main"), snap = await cfg.get();
    if (S.isOwner && !snap.exists) await cfg.set({ createdAt: new Date().toISOString() });
    if (!staff) staff = snap.exists;
  } catch (e) { console.warn(e); }
  S.mode = staff ? "staff" : "partner";
  if (staff && S.canWrite === false && !S.isOwner) S.readOnly = true;
  if (staff) db.doc("config/main").onSnapshot(snap => { S.config = snap.exists ? { ...snap.data() } : {}; S.loaded.config = true; scheduleRender(); }, err => { console.warn("config", err); });
  const cols = S.mode === "partner" ? ["reports"] : COLS;
  for (const c of cols) {
    db.collection(c).onSnapshot(snap => {
      D()[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      S.loaded[c] = true; scheduleRender();
    }, err => {
      console.warn(c, err); S.loaded[c] = true;
      if (err && err.code === "revoked") S.status = "revoked";
      scheduleRender();
    });
  }
  S.status = "ready"; render();
}
let shownDay = today();
setInterval(() => { if (today() !== shownDay) { shownDay = today(); scheduleRender(); } }, 60000);
boot();
</script>
