{% load crm %}
<form method="get" class="filters">
  <input type="search" name="q" value="{{ f.q }}" placeholder="Поиск: имя, телефон, email">
  <select name="cohort">
    <option value="">Все потоки</option>
    {% for c in cohorts %}<option value="{{ c.pk }}" {% if f.cohort == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
    <option value="none" {% if f.cohort == "none" %}selected{% endif %}>Без потока</option>
  </select>
  {% if mentors %}
  <select name="mentor">
    <option value="">Все менторы</option>
    {% for m in mentors %}<option value="{{ m.pk }}" {% if f.mentor == m.pk|stringformat:"s" %}selected{% endif %}>{{ m|user_name }}</option>{% endfor %}
  </select>
  {% endif %}
  {% if partners %}
  <select name="partner">
    <option value="">Все источники</option>
    {% for p in partners %}<option value="{{ p.pk }}" {% if f.partner == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
  </select>
  {% endif %}
  {% if with_stage %}
  <select name="stage">
    <option value="">Все этапы</option>
    {% for v, l in stage_choices %}<option value="{{ v }}" {% if f.stage == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
  {% endif %}
  {% if show_closed_toggle %}
  <label class="check"><input type="checkbox" name="closed" value="1" {% if show_closed %}checked{% endif %}> Показать выбывших</label>
  {% endif %}
  <button class="btn">Применить</button>
  {% if f.q or f.cohort or f.mentor or f.partner or f.stage %}<a class="btn ghost" href="?">Сбросить</a>{% endif %}
</form>
