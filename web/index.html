<title>CRM Менти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Раскладка: тёмное узкое меню слева, светлая рабочая область, карточка студента выезжает панелью справа.
   Система: шрифт Golos Text, размеры 12 / 13 / 14 / 16 / 18 / 24; отступы кратны 4; радиусы 8 (элементы), 10 (карточки), 14 (окна);
   высота элементов управления 34, на сенсорных экранах 44. Цвет несёт смысл: синий — действие, бирюзовый, фиолетовый и зелёный — группы этапов,
   красный — просрочка и удаление, жёлтый — только знак и «нет следующего шага». */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eceef2;
  --border: #dfe2e8;
  --text: #13161b;
  --muted: #626a78;
  --brand: #2952e3;
  --brand-ink: #ffffff;
  --brand-soft: #e5ebfd;
  --mark: #ffd21f;      /* жёлтая метка — отсылка к 1С */
  --mark-ink: #1b1a17;
  --side: #14171d;
  --side-2: #262b35;
  --side-text: #aab2c0;
  --side-ink: #ffffff;
  --side-muted: #8891a1;
  --hot: #d13438;
  --danger: #c0362c;
  --danger-soft: #fbe6e3;
  --warn: #8a5a00;
  --warn-soft: #fbefd0;
  --ok: #1f7a4a;
  --ok-soft: #dcf1e5;
  --g-sales: #0b7a85;  --g-sales-soft: #dcf0f1;
  --g-study: #7446b8;  --g-study-soft: #ece4f7;
  --g-job: #1f7a4a;    --g-job-soft: #dcf1e5;
  --g-closed: #5b6472; --g-closed-soft: #e8eaee;
  --c1: #2952e3;       /* график: получено */
  --c2: #c8741c;       /* график: ожидается */
  --c3: #7a879e;       /* график: третий ряд */
  --overlay: rgba(15, 18, 24, .42);
  --pop: 0 12px 36px rgba(15, 20, 30, .18);
  --font: "Golos Text", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 10px;
  --r-ctl: 8px;
  --ctl: 34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --surface-2: #22262e; --border: #2d323c;
    --text: #e7e9ee; --muted: #959dab; --brand: #7d9bff; --brand-ink: #0d1330; --brand-soft: #1d2748;
    --side: #0a0c0f; --side-2: #1b1f27; --side-text: #9aa2b0; --side-ink: #ffffff; --side-muted: #7d8595; --hot: #d13438;
    --danger: #f0857b; --danger-soft: #3a2120; --warn: #e3b556; --warn-soft: #372d1a; --ok: #6fcb97; --ok-soft: #183224;
    --g-sales: #4fc0cb; --g-sales-soft: #12333a; --g-study: #b998ee; --g-study-soft: #2a2140;
    --g-job: #6fcb97; --g-job-soft: #183224; --g-closed: #959dab; --g-closed-soft: #262a32;
    --c1: #5b82f5; --c2: #c97a2c; --c3: #8d99b0;
    --overlay: rgba(0, 0, 0, .6); --pop: 0 12px 36px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --surface-2: #22262e; --border: #2d323c;
  --text: #e7e9ee; --muted: #959dab; --brand: #7d9bff; --brand-ink: #0d1330; --brand-soft: #1d2748;
  --side: #0a0c0f; --side-2: #1b1f27; --side-text: #9aa2b0; --side-ink: #ffffff; --side-muted: #7d8595; --hot: #d13438;
  --danger: #f0857b; --danger-soft: #3a2120; --warn: #e3b556; --warn-soft: #372d1a; --ok: #6fcb97; --ok-soft: #183224;
  --g-sales: #4fc0cb; --g-sales-soft: #12333a; --g-study: #b998ee; --g-study-soft: #2a2140;
  --g-job: #6fcb97; --g-job-soft: #183224; --g-closed: #959dab; --g-closed-soft: #262a32;
  --c1: #5b82f5; --c2: #c97a2c; --c3: #8d99b0;
  --overlay: rgba(0, 0, 0, .6); --pop: 0 12px 36px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html.locked { overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
a { color: var(--brand); }
h1 { font-size: 24px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
h1 small { color: var(--muted); font-weight: 400; font-size: 15px; letter-spacing: 0; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.right { margin-left: auto; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 14px 16px; }
.hint { color: var(--muted); font-size: 13px; }
.danger-text { color: var(--danger); }
.warn-text { color: var(--warn); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible, .tabs button:focus-visible, .link:focus-visible, .x:focus-visible, .nav button:focus-visible, .seg button:focus-visible, .chk:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Каркас */
.layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--side) 224px, var(--bg) 224px); }
.side { color: var(--side-text); padding: 16px 10px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; align-self: start; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; padding: 0 8px; font-size: 15px; color: var(--side-ink); }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--mark); color: var(--mark-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.gsearch { position: relative; }
.gsearch input { background: var(--side-2); border-color: transparent; padding: 6px 10px; color: var(--side-ink); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.gsearch input::placeholder { color: var(--side-muted); }
.gsearch input:focus { outline: 2px solid var(--brand); border-color: transparent; }
#gq-res { color: var(--text); }
#gq-res { position: absolute; z-index: 12; left: 0; top: calc(100% + 4px); width: max(100%, 280px); max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--pop); padding: 4px; }
#gq-res button { all: unset; box-sizing: border-box; display: flex; gap: 8px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
#gq-res button:hover, #gq-res button.on { background: var(--surface-2); }
#gq-res .sub { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { all: unset; box-sizing: border-box; cursor: pointer; padding: 6px 10px; min-height: 36px; border-radius: var(--r-ctl); color: var(--side-text); display: flex; align-items: center; gap: 10px; font-weight: 500; }
.nav-rest { display: contents; }
.nav .more { display: none; }
.nav .more .ico { stroke-width: 3; }
.nav button:hover { background: var(--side-2); color: var(--side-ink); }
.nav button.on { background: var(--side-2); color: var(--side-ink); font-weight: 600; }
.nav button.on .ico { color: var(--mark); }
.nav .n { margin-left: auto; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--side-2); color: var(--side-text); border-radius: 99px; padding: 0 7px; line-height: 18px; }
.nav button.on .n { background: rgba(255, 255, 255, .12); }
.nav .n.hot, .nav button.on .n.hot { background: var(--hot); color: #fff; }
.side-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--side-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.busy { background: var(--warn); }
.main { padding: 24px 32px 56px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head > div { min-width: 0; }
.page-head p { margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions select { width: auto; }
.back { all: unset; cursor: pointer; font-size: 13px; color: var(--muted); display: inline-block; margin-bottom: 4px; }
.back:hover { color: var(--text); }

/* Элементы */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; flex-wrap: wrap; }
.panel > header h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.panel > header .cnt { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.panel .pad { padding: 0 16px 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 12px; min-height: var(--ctl); border-radius: var(--r-ctl); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.btn.small { padding: 2px 10px; font-size: 13px; min-height: 28px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.badge, .tag { display: inline-block; padding: 0 7px; border-radius: 5px; font-size: 12px; line-height: 20px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b-sales { background: var(--g-sales-soft); color: var(--g-sales); }
.b-study { background: var(--g-study-soft); color: var(--g-study); }
.b-job { background: var(--g-job-soft); color: var(--g-job); }
.b-closed { background: var(--g-closed-soft); color: var(--g-closed); }
.tag.ok, .tag.a-accepted, .tag.a-offer { background: var(--ok-soft); color: var(--ok); }
.tag.danger, .tag.a-rejected { background: var(--danger-soft); color: var(--danger); }
.tag.warn, .tag.a-interview, .tag.a-test { background: var(--warn-soft); color: var(--warn); }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; margin-left: auto; flex: none; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 9px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); margin-bottom: 16px; }
.banner p { flex: 1 1 260px; }
.link { all: unset; cursor: pointer; color: var(--brand); font-weight: 500; }
.link:hover { text-decoration: underline; }

input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 6px 10px; min-height: var(--ctl); width: 100%; min-width: 0; }
input[type=checkbox], input[type=radio] { min-height: 0; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
::placeholder { color: var(--muted); opacity: 1; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
input[type=checkbox] { width: auto; accent-color: var(--brand); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters input[type=search] { flex: 1 1 220px; max-width: 280px; }
.filters select { width: auto; max-width: 100%; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.seg .n { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--text); border-color: var(--brand); font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
tfoot td { border-top: 1px solid var(--border); border-bottom: 0; font-weight: 600; }
.compact th, .compact td { padding: 6px 8px; }
.compact th:first-child, .compact td:first-child { padding-left: 0; }
.compact th:last-child, .compact td:last-child { padding-right: 0; }
.row-danger td { background: var(--danger-soft); }
.row-actions { text-align: right; white-space: nowrap; }
.sub { color: var(--muted); font-size: 13px; }

/* Списки дел */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 8px 16px; border-top: 1px solid var(--border); min-width: 0; }
.rows li.click { cursor: pointer; }
.rows li.click:hover { background: var(--surface-2); }
.rows li:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.rows .who { min-width: 0; flex: 1 1 150px; display: flex; flex-direction: column; }
.rows .who strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .who span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .when { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows .when.late { color: var(--danger); font-weight: 600; }
.rows .acts { display: flex; gap: 6px; margin-left: auto; }
.rows .amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.chk { all: unset; box-sizing: border-box; flex: none; position: relative; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); cursor: pointer; display: grid; place-items: center; }
.chk::before { content: ""; position: absolute; inset: -11px; }
.chk:hover { border-color: var(--ok); background: var(--ok-soft); }
.chk:hover::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg) translateY(-1px); }
.today { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.rows .who.wrap span { white-space: normal; }
.tbtn { all: unset; box-sizing: border-box; cursor: pointer; width: 28px; height: 28px; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--side-text); flex: none; margin-left: auto; }
.tbtn:hover { background: var(--side-2); color: var(--side-ink); }
.tbtn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.side-foot .tbtn + .link { margin-left: 4px; }
td.clip { white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.nw { white-space: nowrap; }
.side-foot .st { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.allclear { padding: 22px 16px; color: var(--muted); border-top: 1px solid var(--border); }
.allclear strong { color: var(--text); display: block; font-weight: 600; }

/* Аналитика */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 1px; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); min-width: 0; }
.kpi.accent { background: var(--brand-soft); }
.kpi-label { color: var(--muted); font-size: 13px; }
.kpi-value { font-size: 24px; line-height: 1.25; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-sub { color: var(--muted); font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; margin-bottom: 16px; align-items: start; }
.funnel { display: flex; flex-direction: column; gap: 7px; }
.funnel-row { display: grid; grid-template-columns: minmax(96px, 160px) 1fr 74px 56px; gap: 10px; align-items: center; }
.funnel-row.head { color: var(--muted); font-size: 12px; }
.funnel-row.head span { text-align: right; }
.funnel-step { text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.eq { margin: 0; }
.funnel-label { font-size: 13px; }
.funnel-bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.funnel-bar > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; min-width: 2px; }
.funnel-num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.funnel-num small { color: var(--muted); font-weight: 400; }

/* Доска */
.board-bar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.board-bar .filters { margin: 0; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(232px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 190px); min-width: 0; }
.col > header { display: flex; align-items: center; gap: 8px; padding: 9px 8px 5px 12px; font-weight: 600; font-size: 13px; }
.col > header::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--g-sales); flex: none; }
.col.g-study > header::before { background: var(--g-study); }
.col.g-job > header::before { background: var(--g-job); }
.col.g-closed > header::before { background: var(--g-closed); }
.count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.col-add { all: unset; cursor: pointer; margin-left: auto; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); font-size: 17px; line-height: 1; }
.col-add:hover { background: var(--surface); color: var(--text); }
.col-body { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 56px; }
.col-body .empty { padding: 8px 4px; font-size: 13px; }
.col.drop { outline: 2px dashed var(--brand); outline-offset: -2px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; cursor: grab; min-width: 0; }
.tile:hover { border-color: var(--brand); }
.tile.alert { box-shadow: inset 3px 0 0 var(--danger); }
.tile.dragging { opacity: .45; }
.tile strong { font-weight: 600; font-size: 14px; }
.tile-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.tile-step { font-size: 13px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.tile-step .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tile-step .d { margin-left: auto; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile-step.late .d { color: var(--danger); font-weight: 600; }
.tile-step.none { color: var(--warn); }
.tile-foot { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 2px; flex-wrap: wrap; color: var(--muted); }
.tile-move { display: none; width: auto; align-self: flex-start; padding: 2px 6px; font-size: 12px; border-radius: 6px; max-width: 100%; color: var(--muted); }

// меняя одно, меняйте другое.

function funnelHTML(rows) {

  return `<div class="funnel"><div class="funnel-row head" aria-hidden="true"><i></i><i></i><span>от всех</span><span>от пред.</span></div>${rows.map((r, i) => `<div class="funnel-row"><span class="funnel-label">${esc(SLABEL[r.key] || r.label)}</span><span class="funnel-bar"><span style="width:${Math.max(0, Math.min(100, +r.pct || 0))}%"></span></span><span class="funnel-num">${esc(r.count)} <small>${esc(r.pct)}%</small></span><span class="funnel-step"${i ? ` title="Дошли с предыдущего этапа"` : ""}>${step(i)}</span></div>`).join("")}</div>`;
}
function barPath(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
const fmtK = v => v >= 1e6 ? `${(v / 1e6).toFixed(v % 1e6 ? 1 : 0).replace(".", ",")}\u00a0млн` : v >= 1000 ? `${String(+(v / 1000).toFixed(2)).replace(".", ",")}\u00a0тыс.` : String(Math.round(v));
function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
// Столбцы по месяцам: получено и ожидается сложены в один столбец, между ними зазор
// Столбики по месяцам из нескольких рядов, один над другим. items: [{ label, cur, vals: [..], tip }]
function stackChart(id, items, aria, fmt = fmtK, whole = false) {
  const W = 720, H = 230, L = 52, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const peak = Math.max(...items.map(m => sum(m.vals, v => v)), 0);
  // whole — счётчики: шкала кратна четырём, чтобы подписи были целыми и не повторялись
  const top = whole ? Math.max(4, Math.ceil(peak / 4) * 4) : niceMax(peak), y = v => T + ph - v / top * ph;
  const step = pw / items.length, bw = Math.min(30, step * .56);
  const grid = [0, .25, .5, .75, 1].map(k => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(top * k)}" y2="${y(top * k)}"></line><text x="${L - 8}" y="${y(top * k) + 4}" text-anchor="end">${k ? fmt(top * k) : "0"}</text>`).join("");
  const bars = items.map((m, i) => {
    const x = L + step * i + (step - bw) / 2, last = m.vals.reduce((a, v, n) => v > 0 ? n : a, -1);
    let base = 0;
    const parts = m.vals.map((v, n) => { if (!(v > 0)) return ""; const h = v / top * ph, gap = n !== last ? 2 : 0; base += v; return `<path class="s${n + 1}" d="${barPath(x, y(base), bw, Math.max(h - gap, 1), n === last ? 4 : 0)}"></path>`; }).join("");
    return `<g data-tip="${esc(m.tip)}"><rect class="hit" x="${L + step * i}" y="${T}" width="${step}" height="${ph}"></rect>${parts}<text class="${m.cur ? "now" : ""}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(m.label)}</text></g>`;
  }).join("");
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${grid}${bars}</svg>`;
}
const legendHTML = items => `<div class="legend" style="margin-bottom:8px">${items.map((l, i) => `<span><i style="background:var(--c${i + 1})"></i>${l}</span>`).join("")}</div>`;

function moneyChart(months) {
  const W = 720, H = 230, L = 52, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const top = niceMax(Math.max(...months.map(m => m.got + m.exp))), y = v => T + ph - v / top * ph;
  const step = pw / months.length, bw = Math.min(30, step * .56);
  const grid = [0, .25, .5, .75, 1].map(k => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(top * k)}" y2="${y(top * k)}"></line><text x="${L - 8}" y="${y(top * k) + 4}" text-anchor="end">${k ? fmtK(top * k) : "0"}</text>`).join("");
  const bars = months.map((m, i) => {
    const x = L + step * i + (step - bw) / 2, hg = m.got / top * ph, he = m.exp / top * ph, gap = hg > 0 && he > 0 ? 2 : 0;
    const tip = `${m.label} ${m.year}${m.got ? `\nПолучено: ${money(m.got)}` : ""}${m.exp ? `\nОжидается: ${money(m.exp)}` : ""}${!m.got && !m.exp ? "\nНет платежей" : ""}`;
    return `<g data-tip="${esc(tip)}"><rect class="hit" x="${L + step * i}" y="${T}" width="${step}" height="${ph}"></rect>
      ${hg > 0 ? `<path class="s1" d="${barPath(x, y(m.got), bw, hg, he > 0 ? 0 : 4)}"></path>` : ""}
      ${he > 0 ? `<path class="s2" d="${barPath(x, y(m.got + m.exp), bw, Math.max(he - gap, 1), 4)}"></path>` : ""}
      <text class="${m.cur ? "now" : ""}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${m.label}</text></g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Получено и ожидается по месяцам">${grid}${bars}</svg>`;
}

function tileHTML(s) {

}

// ----- Список и поток: общая таблица с выбором нескольких студентов -----

      ${mods ? `<td>${stepCell(s)}</td>` : `<td class="clip" title="${esc(partnerById(s.partnerId)?.name || s.utmSource || "")}">${esc(partnerById(s.partnerId)?.name || s.utmSource || "—")}</td>`}
      <td class="clip" title="${esc(teamName(s.mentorId) || "")}">${esc(teamName(s.mentorId) || "—")}</td><td class="num">${paidCell(s)}</td>
    </tr>`).join("") || `<tr><td colspan="${cols}" class="empty">${emptyText}</td></tr>`}</tbody>

function listView() {

// ----- Потоки -----
function cohortStats(c) {
  const list = D().students.filter(s => s.cohortId === c.id), act = list.filter(s => s.stage !== "lost");
  const studying = act.filter(s => SGROUP[s.stage] !== "sales"), progs = studying.map(progressOf).filter(Boolean);
  const open = act.flatMap(s => (s.payments || []).filter(p => !p.paid));
  return {
    list, act, studying, leads: act.length - studying.length, mods: c.modules || [], avg: progs.length ? Math.round(sum(progs, p => p.pct) / progs.length) : null,
    paid: sum(act, paidSum), price: sum(act, s => s.price), overdue: sum(open.filter(p => p.due < today()), p => p.amount),
    noStep: act.filter(s => isActive(s) && !hasStep(s)).length, employed: act.filter(s => EMPLOYED.includes(s.stage)).length,
  };
}

        <dt>Прогресс</dt><dd>${st.avg !== null ? `<span class="prog wide"><span class="prog-bar"><span style="width:${st.avg}%"></span></span><span>${st.avg}%</span></span>` : `<span class="sub">${st.mods.length ? "нет отметок" : "программа не задана"}</span>`}</dd>

// ----- Панель студента -----
// ----- Оплата с зарплаты: после трудоустройства студент платит процент с зарплаты заданное число месяцев -----
const salaryDefaults = () => { const c = S.config.salaryPlan || {}; return { percent: nnum(c.percent) > 0 ? nnum(c.percent) : null, months: nnum(c.months) >= 1 ? Math.round(nnum(c.months)) : null }; };
// Платёж от дохода: при почасовой оплате сумма заранее неизвестна, в платеже записан только процент
const isPending = x => !!x && typeof x === "object" && (x.amount === null || x.amount === undefined || x.amount === "") && nnum(x.percent) > 0;
const SALARY_KINDS = [["salary", "Оклад: сумма известна заранее"], ["income", "Почасовая или сдельная: сумма каждый месяц разная"]];
const pctText = v => String(nnum(v)).replace(".", ",") + "%";
const salaryCheck = (salary, percent, months, first, kind = "salary") => kind !== "income" && !(salary > 0) ? "Укажите зарплату" : !(percent > 0 && percent <= 100) ? "Процент с зарплаты — больше 0 и не больше 100"
  : !(Math.round(months) >= 1 && Math.round(months) <= 60) ? "Период — от 1 до 60 месяцев" : !isDay(first) ? "Укажите дату первого платежа" : "";
function salaryItems(salary, percent, months, first, kind = "salary") {
  const amount = Math.round(salary * percent / 100), items = [];
  for (let i = 0; i < months; i++) items.push(kind === "income"
    ? { id: newId("x"), amount: null, percent, due: addMonths(first, i), paid: null, comment: `С дохода ${i + 1}/${months}` }
    : { id: newId("x"), amount, due: addMonths(first, i), paid: null, comment: `С зарплаты ${i + 1}/${months}` });
  return items;
}
// Стоимость с учётом платежей с зарплаты. Если стоимость не была задана, за основу берутся уже записанные платежи,
// иначе «оплачено» оказалось бы больше стоимости
const priceWith = (cur, items) => (nnum(cur.price) > 0 ? nnum(cur.price) : (Array.isArray(cur.payments) ? cur.payments : []).reduce((a, x) => a + (x && typeof x === "object" ? nnum(x.amount) : 0), 0)) + sum(items, x => x.amount);
const salaryLog = (salary, percent, first, items) => isPending(items[0])
  ? logItem(`Оплата с дохода: ${pctText(percent)} от дохода за месяц, ${items.length} ${plural(items.length, "платёж", "платежа", "платежей")}, первый расчёт ${fDate(first)}`)
  : logItem(`Оплата с зарплаты: ${percent}% от ${money(salary)}, ${items.length} ${plural(items.length, "платёж", "платежа", "платежей")} по ${money(items[0].amount)}, первый ${fDate(first)}`);
const salarySum = (salary, percent, months, kind = "salary") => kind === "income"
  ? (percent > 0 && months >= 1 ? `${Math.round(months)} ${plural(Math.round(months), "платёж", "платежа", "платежей")} по ${pctText(percent)} от дохода за месяц. Сумму каждого вы вносите, когда студент сообщит доход` : "")
  : salary > 0 && percent > 0 && months >= 1 ? `${Math.round(months)} ${plural(Math.round(months), "платёж", "платежа", "платежей")} по ${money(Math.round(salary * percent / 100))}, всего ${money(Math.round(salary * percent / 100) * Math.round(months))}` : "";
// Процент и период запоминаются: в следующей форме они уже подставлены
function rememberSalary(percent, months) {
  const d = salaryDefaults();
  if (S.limited || S.readOnly || (d.percent === percent && d.months === months)) return;
  enqueue("config/main", () => S.db.doc("config/main").set(clean({ ...S.config, salaryPlan: { percent, months } }))).catch(e => console.warn("config", e));
}
function salaryPlanForm(s) {
  const d = salaryDefaults(), val = k => +($("#m-" + k)?.value) || 0, kind = () => $("#m-kind")?.value === "income" ? "income" : "salary";
  openModal({
    title: `Оплата с зарплаты: ${s.name}`, submit: "Создать платежи",
    values: { kind: "salary", salary: s.jobSalary || null, percent: d.percent, months: d.months, first: addMonths(today(), 1) },
    fields: [{ k: "kind", label: "Как платят студенту", type: "select", options: SALARY_KINDS, wide: true },
      { k: "salary", label: "Зарплата, ₽", type: "number", help: "При почасовой оплате оставьте пустым" }, { k: "percent", label: "Процент, %", type: "number", req: true },
      { k: "months", label: "Сколько месяцев", type: "number", req: true }, { k: "first", label: "Первый платёж", type: "date", req: true, help: "Следующие — в тот же день каждого месяца" }],
    extra: `<p><strong id="m-sum">${esc(salarySum(s.jobSalary, d.percent, d.months))}</strong></p><p class="hint">При окладе стоимость обучения в карточке вырастет на сумму платежей. При почасовой оплате сумма появляется каждый месяц: бот в день расчёта спросит у студента доход, вы внесёте его кнопкой «Указать доход».</p>`,
    onInput: () => { const el = $("#m-sum"); if (el) el.textContent = salarySum(val("salary"), val("percent"), val("months"), kind()); },
    onSubmit: v => {
      const k = v.kind === "income" ? "income" : "salary", err = salaryCheck(v.salary, v.percent, v.months, v.first, k); if (err) return err;
      const n = Math.round(v.months), items = salaryItems(v.salary, v.percent, n, v.first, k);
      return save(() => patchStudent(s.id, cur => ({ payments: [...(cur.payments || []), ...items], ...(k === "income" ? {} : { price: priceWith(cur, items) }), ...(cur.jobSalary || !(v.salary > 0) ? {} : { jobSalary: v.salary }), log: withLog(cur, salaryLog(v.salary, v.percent, v.first, items)) })), `Создано платежей: ${n}`)
        .then(ok => { if (ok) rememberSalary(v.percent, n); return ok; });
    },
  });
}
// Доход за месяц при почасовой оплате: из него считается сумма платежа
function incomeForm(s, p) {
  const due = (income) => Math.round(income * nnum(p.percent) / 100);
  openModal({
    title: `Доход за месяц: ${s.name}`, submit: "Посчитать платёж", values: {},
    fields: [{ k: "income", label: "Сколько студент заработал, ₽", type: "number", req: true, wide: true, help: `Платёж — ${pctText(p.percent)} от этой суммы, срок ${fDate(p.due)}` }],
    extra: `<p><strong id="m-sum"></strong></p>`,
    onInput: () => { const el = $("#m-sum"), v = +($("#m-income")?.value) || 0; if (el) el.textContent = v > 0 ? `К оплате: ${money(due(v))}` : ""; },
    onSubmit: v => {
      const amount = due(v.income);
      if (!(amount > 0)) return "Укажите доход больше нуля";
      return save(() => patchStudent(s.id, cur => {
        const old = (cur.payments || []).find(x => x.id === p.id); if (!old || !isPending(old)) return null;
        return { payments: cur.payments.map(x => x.id === p.id ? { ...x, amount, income: v.income } : x), price: priceWith(cur, [{ amount }]),
          log: withLog(cur, logItem(`Доход за месяц ${money(v.income)}: платёж ${pctText(old.percent)} — ${money(amount)}, срок ${fDate(old.due)}`)) };
      }), `К оплате ${money(amount)}. Сообщите сумму студенту кнопкой «Напомнить»`);
    },
  });
}
// Напомнит ли бот студенту о платеже: только если его чат подключён к карточке
function botLine(s) {
  const tg = S.me?.telegram;
  if (!S.server || !tg?.enabled || !tg.bot) return "";
  return `<p class="hint" style="margin-top:6px">${s.tgId ? "Студент подключён к боту: в день платежа бот ему напомнит." : `Студент не подключён к боту и напоминаний о платежах не получит. ${S.readOnly ? "" : `<button class="link" data-act="tg-student" data-id="${esc(s.id)}">Получить ссылку для студента</button>`}`}</p>`;
}
function paySection(s) {

  else list = sortBy(all.filter(p => p.paid), p => p.paid).reverse();
  const tab = (k, l) => `<button data-act="paytab" data-v="${k}" class="${S.payTab === k ? "on" : ""}">${l}</button>`;
  const emptyText = { overdue: "Просроченных платежей нет", upcoming: "Ожидаемых платежей нет. График рассрочки создаётся в карточке студента.", paid: "Оплат пока не было" }[S.payTab];
  return headHTML("Платежи") + `<nav class="tabs">${tab("overdue", "Просроченные")}${tab("upcoming", "Ожидаются")}${tab("paid", "Оплаченные")}</nav>
  <div class="panel table-wrap"><table>
    <thead><tr><th>Студент</th><th>Поток</th><th>${S.payTab === "paid" ? "Оплачен" : "Срок"}</th><th class="num">Сумма</th><th>Комментарий</th><th></th></tr></thead>
    <tbody>${list.map(p => `<tr class="click" data-act="open" data-id="${esc(p.s.id)}"><td><strong>${esc(p.s.name)}</strong></td>
      <td>${esc(cohortName(p.s.cohortId) || "—")}</td><td${!p.paid && p.due < t ? ' class="danger-text"' : ""}>${fDate(S.payTab === "paid" ? p.paid : p.due)}</td><td class="num">${money(p.amount)}</td><td class="muted">${esc(p.comment)}</td>
      <td class="row-actions">${p.paid ? "" : `<button class="btn small ghost" data-act="pay-remind" data-id="${esc(p.s.id)}" data-pid="${esc(p.id)}" title="Скопировать текст напоминания">Напомнить</button> <button class="btn small" data-act="pay-done" data-id="${esc(p.s.id)}" data-pid="${esc(p.id)}">Оплачен</button>`}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">${emptyText}</td></tr>`}</tbody>
    ${list.length ? `<tfoot><tr><td colspan="3">Итого</td><td class="num">${money(sum(list, p => p.amount))}</td><td colspan="2"></td></tr></tfoot>` : ""}
  </table></div>`;
}

const queues = {};

const ref = (col, id) => S.db.collection(col).doc(id);

// Правка студента: патч считается от актуальной записи в момент выполнения, а не в момент клика
function patchStudent(id, fn) {
  return enqueue("students/" + id, async () => {
    // На сервере данные приходят опросом раз в несколько секунд: перед правкой подтягиваем свежую запись,
    // иначе массив, собранный из устаревшей копии, затёр бы чужую правку
    if (SRV) await SRV.fresh().catch(() => { });
    const cur = stu(id); if (!cur) throw { code: "gone" };
    const patch = fn(cur); if (!patch) return;
    await ref("students", id).update(clean(patch));
    // Следующая правка в очереди увидит это изменение, не дожидаясь ответа базы. Вложенные объекты база сливает по ключам.
    const local = { ...patch }; if (patch.progress) local.progress = { ...(cur.progress || {}), ...patch.progress };
    Object.assign(cur, local);
  });
}
const delDoc = (col, id) => enqueue(col + "/" + id, () => ref(col, id).delete());
const newId = col => S.db.collection(col).doc().id;
function clean(o) { return JSON.parse(JSON.stringify(o)); } // поля со значением undefined не записываются
async function save(fn, okMsg) {

  S.pending++; renderSync();
  try { await fn(); if (okMsg) toast(okMsg); scheduleReports(); return true; }
  catch (e) {
    console.warn(e);
    if (e && e.code === "invalid_argument" && S.canWrite !== true && !S.isOwner) { S.readOnly = true; toast("Нет прав на изменение данных"); scheduleRender(); }
    else if (e && e.code === "gone") { toast("Этого студента уже удалили"); scheduleRender(); }
    else if (e && (e.code === "gone-item" || e.code === "not_found")) { toast("Эту запись уже удалили"); scheduleRender(); }
    else if (e && e.code === "permission_denied") { toast("На это действие у вас нет прав"); scheduleRender(); }
    else if (S.server && e && e.code === "invalid_argument" && e.message) toast(e.message);
    else if (e && e.code === "quota_exceeded") toast("База заполнена: удалите старые записи и попробуйте снова");
    else toast("Не удалось сохранить. Проверьте интернет и попробуйте ещё раз");

}
function stageChange(s, to, extra = {}) {

async function moveStage(id, to, extra = {}) {

  if (ok && at) toast(`${mask(s.name) || s.name}: ${SLABEL[to]}`, () => save(() => patchStudent(id, cur => {

const cohortOpts = () => [["", "—"], ...sortBy(D().cohorts, c => c.start || "").reverse().map(c => [c.id, c.name])];

// Контакт одной строкой: сам определяем, что это — телефон, email или Telegram
function parseContact(raw) {
  const v = String(raw || "").trim();
  if (!v) return {};
  if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return { email: v };
  if (/^\+?[\d\s()\-]{6,}$/.test(v)) return { phone: v };
  const tg = v.replace(/^https?:\/\/t\.me\//i, "").replace(/^@/, "");
  return { telegram: /^[A-Za-z0-9_]{3,}$/.test(tg) ? "@" + tg : v };
}
function findDuplicate(c) {
  const digits = x => String(x || "").replace(/\D/g, "").slice(-10), low = x => String(x || "").trim().toLowerCase().replace(/^@/, "");
  return [...D().students, ...S.trash].find(s => (c.phone && digits(c.phone).length >= 6 && digits(s.phone) === digits(c.phone)) || (c.email && low(s.email) === low(c.email)) || (c.telegram && low(s.telegram) === low(c.telegram)));
}

function leadDoc(name, c, partnerId, stage = "new") {

// Массовый ввод: строки из таблицы или CSV. В каждой строке ищем имя, контакты и источник.
function splitRow(line) {
  const delim = line.includes("\t") ? "\t" : line.includes(";") ? ";" : ",";
  const cells = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (ch === delim && !q) { cells.push(cur); cur = ""; }
    else cur += ch;
  }
  cells.push(cur);
  return cells.map(x => x.trim()).filter(Boolean);
}
function parseLeads(text, defPartner) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, 300);
  const low = x => String(x || "").trim().toLowerCase(), seen = new Set(), out = [];
  const partners = D().partners.filter(p => p.active !== false);
  const key = c => { const k = [c.phone && "p" + c.phone.replace(/\D/g, "").slice(-10), c.email && "e" + low(c.email), c.telegram && "t" + low(c.telegram).replace(/^@/, "")].filter(Boolean); return k.length ? k : ["n" + low(c.name)]; };
  lines.forEach((line, n) => {
    const cells = splitRow(line);
    if (n === 0 && cells.some(x => /^(имя|фио|name|телефон|phone|e-?mail|почта|telegram|телеграм|контакт|источник)$/i.test(x))) return;
    const r = { name: "", phone: "", telegram: "", email: "", partnerId: defPartner || null }, words = [];
    for (const cell of cells) {
      if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cell)) r.email = r.email || cell;
      else if (/^\+?[\d\s()\-]{6,}$/.test(cell)) r.phone = r.phone || cell;
      else if (/^@[A-Za-z0-9_]{3,}$/.test(cell) || /^https?:\/\/t\.me\//i.test(cell)) r.telegram = r.telegram || parseContact(cell).telegram;
      else words.push(cell);
    }
    // Источник: промокод или utm распознаём всегда, название партнёра — только если в строке есть ещё и имя
    const pi = words.findIndex(w => partners.some(p => [p.promo, p.utm].some(v => v && low(v) === low(w)) || (words.length > 1 && low(p.name) === low(w))));
    if (pi >= 0) { const w = words.splice(pi, 1)[0]; r.partnerId = partners.find(p => [p.promo, p.utm, p.name].some(v => v && low(v) === low(w))).id; }
    r.name = words[0] || r.telegram || r.phone || r.email;
    if (!r.name) return;
    const keys = key(r), contact = r.phone || r.email || r.telegram;
    const dup = contact ? findDuplicate(r) : D().students.find(s => low(s.name) === low(r.name));
    r.status = dup ? "dup" : keys.some(k => seen.has(k)) ? "repeat" : "new";
    r.note = dup ? `${dup.deletedAt ? "в корзине" : "уже есть"}: ${dup.name}` : r.status === "repeat" ? "повтор в списке" : "новая";
    keys.forEach(k => seen.add(k)); out.push(r);
  });
  return out;
}

  if (gone.length === 1 && fresh.length === 1 && old.findIndex(m => m.id === gone[0]) === out.indexOf(fresh[0])) fresh[0].id = gone[0];

  return out;
}

async function boot() {
  render();

  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]).catch(() => [null, null]);
  if (!db) { S.status = "nodb"; return render(); }
  S.db = db; S.user = user;
  if (user) {
    try { const me = await user.me(); S.myId = me.id; S.isOwner = !!me.isOwner; S.me = me; S.server = !!me.server; S.limited = S.server && me.role === "mentor"; } catch (e) { }
    try { S.canWrite = await user.can("data.write"); } catch (e) { S.canWrite = null; }
  }
  // Кто смотрит: сотрудник школы или партнёр с правом только на просмотр отчёта
  let staff = S.isOwner || S.canWrite === true;
  try {
    const cfg = db.doc("config/main"), snap = await cfg.get();
    if (S.isOwner && !snap.exists) await cfg.set({ createdAt: new Date().toISOString() });
    if (!staff) staff = snap.exists;
  } catch (e) { console.warn(e); }
  S.mode = staff ? "staff" : "partner";
  if (staff && S.canWrite === false && !S.isOwner) S.readOnly = true;
  if (staff) db.doc("config/main").onSnapshot(snap => { S.config = snap.exists ? { ...snap.data() } : {}; S.loaded.config = true; scheduleRender(); }, err => { console.warn("config", err); });
  const cols = S.mode === "partner" ? ["reports"] : COLS;
  for (const c of cols) {
    db.collection(c).onSnapshot(snap => {
      const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (c === "students") { S.trash = docs.filter(x => x.deletedAt); D()[c] = docs.filter(x => !x.deletedAt); }
      else D()[c] = docs;
      SETTLED = null;
      S.loaded[c] = true; scheduleRender();
    }, err => {
      console.warn(c, err); S.loaded[c] = true;
      if (err && err.code === "revoked") S.status = "revoked";
      scheduleRender();
    });
  }
  S.status = "ready"; render();
  loadAccounts();
}
let shownDay = today();
setInterval(() => { if (today() !== shownDay) { shownDay = today(); scheduleRender(); } }, 60000);
boot();
</script>
